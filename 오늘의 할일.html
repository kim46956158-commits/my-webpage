<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 할일</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--card:#fff;--text:#1f2430;--sub:#6b7280;--line:#e5e7eb;--pri:#4f6ef7;--pri-t:#fff;--study:#e8edff;--study-t:#3347c9;--life:#e3f6ec;--life-t:#1b7a45;--del:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1e2129;--text:#eceef3;--sub:#9aa1af;--line:#2d313b;--pri:#7c92ff;--pri-t:#10131c;--study:#27305a;--study-t:#b4c1ff;--life:#1f3a2c;--life-t:#8fdcae;--del:#ff7b7b}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1e2129;--text:#eceef3;--sub:#9aa1af;--line:#2d313b;--pri:#7c92ff;--pri-t:#10131c;--study:#27305a;--study-t:#b4c1ff;--life:#1f3a2c;--life-t:#8fdcae;--del:#ff7b7b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.date{display:flex;align-items:center;gap:8px}
.date input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px}
button.pri{background:var(--pri);color:var(--pri-t);border-color:var(--pri);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input[type=text]{flex:1 1 180px;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:7px}
.tabs button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none}
.txt{flex:1;min-width:0;word-break:break-word}
li.done .txt{text-decoration:line-through;color:var(--sub)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;flex:none}
.tag.study{background:var(--study);color:var(--study-t)}
.tag.life{background:var(--life);color:var(--life-t)}
.acts{display:flex;gap:4px;flex:none}
.acts button{padding:4px 8px;font-size:12px}
.acts .d{color:var(--del)}
li input.ed{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--pri);border-radius:8px;padding:6px}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 오늘의 할일</h1>

  <div class="card date">
    <button id="prev" aria-label="전날">‹</button>
    <input type="date" id="date">
    <button id="next" aria-label="다음날">›</button>
    <button id="today">오늘</button>
  </div>

  <div class="card">
    <div class="stats">
      <div><b id="sTotal">0</b><span>전체</span></div>
      <div><b id="sDone">0</b><span>완료</span></div>
      <div><b id="sLeft">0</b><span>남은 일</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card">
    <div class="add">
      <input type="text" id="input" placeholder="할 일을 입력하세요" maxlength="100">
      <select id="cat"><option value="study">학업</option><option value="life">일상</option></select>
      <button class="pri" id="addBtn">추가</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-f="all" class="on">전체</button>
    <button data-f="study">학업</button>
    <button data-f="life">일상</button>
  </div>

  <div class="card"><h2>진행 중 <span id="cDoing"></span></h2><ul id="doing"></ul></div>
  <div class="card"><h2>완료 <span id="cDone"></span></h2><ul id="done"></ul></div>
</div>

<script>
(function(){
  var KEY='todo-app-v1', tasks=[], filter='all', editing=null;
  function pad(n){return String(n).padStart(2,'0')}
  function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  var cur=fmt(new Date());
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p))tasks=p}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var CAT={study:'학업',life:'일상'};

  function shift(n){var d=new Date(cur+'T00:00:00');d.setDate(d.getDate()+n);cur=fmt(d);render()}

  function item(t){
    var li=document.createElement('li');
    if(t.done)li.className='done';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    cb.onchange=function(){t.done=cb.checked;save();render()};
    li.appendChild(cb);
    if(editing===t.id){
      var ip=document.createElement('input');ip.className='ed';ip.value=t.text;ip.maxLength=100;
      var ok=function(){var v=ip.value.trim();if(v)t.text=v;editing=null;save();render()};
      ip.onkeydown=function(e){if(e.key==='Enter')ok();if(e.key==='Escape'){editing=null;render()}};
      li.appendChild(ip);
      var b=document.createElement('button');b.textContent='저장';b.onclick=ok;li.appendChild(b);
      setTimeout(function(){ip.focus()},0);
      return li;
    }
    var sp=document.createElement('span');sp.className='txt';sp.textContent=t.text;li.appendChild(sp);
    var tag=document.createElement('span');tag.className='tag '+t.cat;tag.textContent=CAT[t.cat];li.appendChild(tag);
    var a=document.createElement('div');a.className='acts';
    var e=document.createElement('button');e.textContent='수정';e.onclick=function(){editing=t.id;render()};
    var d=document.createElement('button');d.textContent='삭제';d.className='d';
    d.onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    a.appendChild(e);a.appendChild(d);li.appendChild(a);
    return li;
  }

  function fill(ul,list,msg){
    ul.innerHTML='';
    if(!list.length){var d=document.createElement('div');d.className='empty';d.textContent=msg;ul.appendChild(d);return}
    list.forEach(function(t){ul.appendChild(item(t))});
  }

  function render(){
    $('date').value=cur;
    var day=tasks.filter(function(t){return t.date===cur});
    var total=day.length,done=day.filter(function(t){return t.done}).length;
    $('sTotal').textContent=total;$('sDone').textContent=done;$('sLeft').textContent=total-done;
    $('bar').style.width=(total?Math.round(done/total*100):0)+'%';
    var vis=day.filter(function(t){return filter==='all'||t.cat===filter});
    var dg=vis.filter(function(t){return !t.done}),dn=vis.filter(function(t){return t.done});
    $('cDoing').textContent='('+dg.length+')';$('cDone').textContent='('+dn.length+')';
    fill($('doing'),dg,'진행 중인 할 일이 없어요.');
    fill($('done'),dn,'아직 완료한 일이 없어요.');
    Array.prototype.forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.dataset.f===filter)});
  }

  function add(){
    var v=$('input').value.trim();if(!v)return;
    tasks.push({id:Date.now()+Math.random().toString(36).slice(2,6),text:v,cat:$('cat').value,date:cur,done:false});
    $('input').value='';save();render();$('input').focus();
  }

  $('addBtn').onclick=add;
  $('input').onkeydown=function(e){if(e.key==='Enter')add()};
  $('prev').onclick=function(){shift(-1)};
  $('next').onclick=function(){shift(1)};
  $('today').onclick=function(){cur=fmt(new Date());render()};
  $('date').onchange=function(){if(this.value){cur=this.value;render()}};
  $('tabs').onclick=function(e){var f=e.target.dataset&&e.target.dataset.f;if(f){filter=f;render()}};
  render();
})();
</script>
</body>
</html>

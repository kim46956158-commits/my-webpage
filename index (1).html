<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 시작 홈페이지</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    color: #2d2d2d;
  }

  .clock-section {
    text-align: center;
    margin-bottom: 40px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.15);
  }

  #time {
    font-size: 4rem;
    font-weight: 700;
    letter-spacing: 2px;
  }

  #date {
    font-size: 1.2rem;
    margin-top: 8px;
    font-weight: 400;
  }

  .search-section {
    width: 100%;
    max-width: 600px;
    margin-bottom: 50px;
  }

  .search-box {
    display: flex;
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .search-box:focus-within {
    box-shadow: 0 6px 25px rgba(0,0,0,0.25);
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    padding: 16px 24px;
    font-size: 1.1rem;
  }

  .search-box button {
    border: none;
    background: #4285F4;
    color: #fff;
    padding: 0 28px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .search-box button:hover {
    background: #3367d6;
  }

  .todo-section {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 4px 25px rgba(0,0,0,0.15);
  }

  .todo-section h2 {
    margin-bottom: 18px;
    font-size: 1.4rem;
    color: #333;
  }

  .todo-input {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .todo-input input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
  }

  .todo-input input:focus {
    border-color: #4285F4;
  }

  .todo-input button {
    background: #4285F4;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .todo-input button:hover {
    background: #3367d6;
  }

  #todoList {
    list-style: none;
  }

  #todoList li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px;
    border-bottom: 1px solid #eee;
    animation: fadeIn 0.2s ease;
  }

  #todoList li:last-child {
    border-bottom: none;
  }

  #todoList li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #todoList li span {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
  }

  #todoList li.completed span {
    text-decoration: line-through;
    color: #999;
  }

  #todoList li .delete-btn {
    background: none;
    border: none;
    color: #bbb;
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
    transition: color 0.2s;
  }

  #todoList li .delete-btn:hover {
    color: #e74c3c;
  }

  .empty-msg {
    text-align: center;
    color: #999;
    padding: 20px 0;
    font-size: 0.95rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    #time { font-size: 2.8rem; }
    #date { font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="clock-section">
    <div id="time">00:00:00</div>
    <div id="date">0000년 0월 0일</div>
  </div>

  <div class="search-section">
    <form class="search-box" id="searchForm">
      <input type="text" id="searchInput" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
      <button type="submit">검색</button>
    </form>
  </div>

  <div class="todo-section">
    <h2>📝 오늘의 할 일</h2>
    <form class="todo-input" id="todoForm">
      <input type="text" id="todoInput" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <ul id="todoList"></ul>
  </div>

<script>
  // ---------- 시계 & 날짜 ----------
  const days = ['일','월','화','수','목','금','토'];

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;

    const y = now.getFullYear();
    const mo = now.getMonth() + 1;
    const d = now.getDate();
    const day = days[now.getDay()];
    document.getElementById('date').textContent = `${y}년 ${mo}월 ${d}일 (${day})`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- 구글 검색 ----------
  document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    // URL 형태인지 간단히 판별 (공백 없이 도메인 형태일 때만 URL로 처리)
    const isUrl = /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(query) && !/\s/.test(query);

    let target;
    if (isUrl) {
      target = query.startsWith('http') ? query : 'https://' + query;
    } else {
      target = 'https://www.google.com/search?q=' + encodeURIComponent(query);
    }

    // 팝업 차단을 피하기 위해 현재 탭에서 바로 이동
    window.location.href = target;
  });

  // ---------- 할 일 목록 (localStorage 저장, 불가 시 메모리로 대체) ----------
  const STORAGE_KEY = 'myHomepageTodos';
  const todoList = document.getElementById('todoList');
  const todoForm = document.getElementById('todoForm');
  const todoInput = document.getElementById('todoInput');

  // localStorage 사용 가능 여부 확인 (file:// 등 일부 환경에서는 차단될 수 있음)
  let storageAvailable = true;
  try {
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
  } catch (e) {
    storageAvailable = false;
  }

  // localStorage를 못 쓰는 경우를 위한 메모리 백업 (새로고침 시에는 초기화됨)
  let memoryTodos = [];

  function loadTodos() {
    if (!storageAvailable) return memoryTodos;
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return memoryTodos;
    }
  }

  function saveTodos(todos) {
    if (!storageAvailable) {
      memoryTodos = todos;
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      storageAvailable = false;
      memoryTodos = todos;
    }
  }

  function renderTodos() {
    const todos = loadTodos();
    todoList.innerHTML = '';

    if (todos.length === 0) {
      const emptyMsg = document.createElement('li');
      emptyMsg.className = 'empty-msg';
      emptyMsg.textContent = '오늘의 할 일이 없습니다. 새로운 할 일을 추가해보세요!';
      todoList.appendChild(emptyMsg);
      return;
    }

    todos.forEach((todo, index) => {
      const li = document.createElement('li');
      if (todo.completed) li.classList.add('completed');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.completed;
      checkbox.addEventListener('change', () => {
        const current = loadTodos();
        current[index].completed = checkbox.checked;
        saveTodos(current);
        renderTodos();
      });

      const span = document.createElement('span');
      span.textContent = todo.text;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => {
        const current = loadTodos();
        current.splice(index, 1);
        saveTodos(current);
        renderTodos();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      todoList.appendChild(li);
    });
  }

  todoForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const text = todoInput.value.trim();
    if (!text) return;

    const todos = loadTodos();
    todos.push({ text: text, completed: false });
    saveTodos(todos);
    todoInput.value = '';
    renderTodos();
  });

  renderTodos();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 역량 사전·사후 평가 레이더 차트</title>
<style>
:root { --blue:#3978d4; --red:#e45858; --ink:#243044; --muted:#6b7280; --line:#e5e9f0; --bg:#f5f7fb; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
main { max-width:1100px; margin:32px auto; padding:0 18px 40px; }
header { margin-bottom:22px; }
h1 { font-size:clamp(1.45rem,3vw,2.1rem); margin:0 0 8px; letter-spacing:-.03em; }
.subtitle { color:var(--muted); margin:0; line-height:1.6; }
.layout { display:grid; grid-template-columns:minmax(300px, .85fr) minmax(400px,1.15fr); gap:18px; align-items:start; }
.panel { background:white; border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 5px 20px rgba(35,50,80,.04); }
.panel h2 { font-size:1.05rem; margin:0 0 14px; }
table { border-collapse:collapse; width:100%; }
th,td { padding:9px 5px; border-bottom:1px solid var(--line); text-align:left; font-size:.9rem; }
th { color:var(--muted); font-weight:600; font-size:.78rem; }
td input { width:100%; min-width:0; border:1px solid #dce2eb; border-radius:8px; padding:8px; font:inherit; }
td.score input { text-align:center; }
.remove { border:0; background:#f2f4f8; color:#667085; border-radius:8px; padding:7px 9px; cursor:pointer; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
button { cursor:pointer; border:1px solid #d7deea; background:white; color:var(--ink); border-radius:10px; padding:10px 13px; font-weight:600; }
button.primary { background:#243b64; color:white; border-color:#243b64; }
button:hover { filter:brightness(.97); }
.chart-panel { text-align:center; }
canvas { width:100%; max-width:650px; height:auto; display:block; margin:0 auto; }
.legend { display:flex; justify-content:center; gap:20px; margin:5px 0 0; color:#4b5563; font-size:.9rem; }
.legend span { display:inline-flex; align-items:center; gap:7px; }
.swatch { width:12px; height:12px; border-radius:3px; display:inline-block; }
.summary { margin-top:18px; padding:15px; background:#f7f9fc; border:1px solid var(--line); border-radius:12px; text-align:left; line-height:1.65; }
.summary strong { color:#243b64; }
.note { color:var(--muted); font-size:.8rem; margin-top:12px; }
@media (max-width:820px) { .layout { grid-template-columns:1fr; } main { margin-top:20px; } }
</style>
</head>
<body>
<main>
<header>
  <h1>학생 역량 평가 레이더 차트</h1>
  <p class="subtitle">영역별 사전·사후 점수를 입력하고, 변화와 성장 정도를 한눈에 비교해 보세요. 점수 범위는 0~100점입니다.</p>
</header>
<div class="layout">
  <section class="panel">
    <h2>① 역량 지표 및 점수 입력</h2>
    <table>
      <thead><tr><th style="width:44%">평가 영역</th><th>사전 (0~100)</th><th>사후 (0~100)</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="controls">
      <button id="add">＋ 영역 추가</button>
      <button id="reset">예시 데이터로 초기화</button>
    </div>
    <p class="note">※ 영역은 3개 이상 입력해야 레이더 차트가 의미 있게 표시됩니다. 점수는 0~100 사이의 숫자로 입력해 주세요.</p>
  </section>
  <section class="panel chart-panel">
    <h2>② 사전·사후 역량 비교</h2>
    <canvas id="radar" width="720" height="620" aria-label="사전 사후 역량 레이더 차트"></canvas>
    <div class="legend">
      <span><i class="swatch" style="background:#3978d4"></i> 사전 평가</span>
      <span><i class="swatch" style="background:#e45858"></i> 사후 평가</span>
    </div>
    <div class="summary" id="summary" aria-live="polite"></div>
    <div class="controls" style="justify-content:center">
      <button class="primary" id="save">차트 PNG 저장</button>
      <button id="copy">분석 요약 복사</button>
    </div>
  </section>
</div>
</main>
<script>
const initial = [
  ["의사소통",62,82],["협업",70,88],["문제 해결",55,76],
  ["창의성",68,79],["자기주도성",60,85]
];
const rowsEl = document.getElementById('rows');
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
const blue = '#3978d4', red = '#e45858';
let data = initial.map(x=>({name:x[0],pre:x[1],post:x[2]}));

function renderRows(){
  rowsEl.innerHTML='';
  data.forEach((d,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><input aria-label="영역명 ${i+1}" class="name" value="${escapeHtml(d.name)}"></td>
      <td class="score"><input aria-label="사전 점수 ${i+1}" class="pre" type="number" min="0" max="100" value="${d.pre}"></td>
      <td class="score"><input aria-label="사후 점수 ${i+1}" class="post" type="number" min="0" max="100" value="${d.post}"></td>
      <td><button class="remove" aria-label="영역 삭제 ${i+1}">×</button></td>`;
    tr.querySelector('.name').addEventListener('input',e=>{data[i].name=e.target.value;draw();});
    tr.querySelector('.pre').addEventListener('input',e=>{data[i].pre=validScore(e.target.value);draw();});
    tr.querySelector('.post').addEventListener('input',e=>{data[i].post=validScore(e.target.value);draw();});
    tr.querySelector('.remove').addEventListener('click',()=>{data.splice(i,1);renderRows();});
    rowsEl.appendChild(tr);
  });
  draw();
}
function validScore(v){
  if(v==='') return 0;
  let n=Number(v);
  if(!Number.isFinite(n)) return 0;
  return Math.max(0,Math.min(100,n));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if(data.length<3){
    ctx.fillStyle='#6b7280';ctx.font='20px sans-serif';ctx.textAlign='center';
    ctx.fillText('3개 이상의 영역을 입력하면 차트가 표시됩니다.',W/2,H/2);updateSummary();return;
  }
  const cx=W/2,cy=H/2+5, radius=Math.min(W*.34,H*.34), n=data.length;
  // radar grid
  ctx.lineWidth=1;ctx.strokeStyle='#e3e8f0';
  for(let level=1;level<=5;level++){
    const r=radius*level/5;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*2*Math.PI/n;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.stroke();
    ctx.fillStyle='#8993a5';ctx.font='12px sans-serif';ctx.textAlign='left';
    ctx.fillText(String(level*20),cx+4,cy-r+4);
  }
  // axes and labels
  data.forEach((d,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n;
    const x=cx+Math.cos(a)*radius,y=cy+Math.sin(a)*radius;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();
    const lx=cx+Math.cos(a)*(radius+27),ly=cy+Math.sin(a)*(radius+27);
    ctx.fillStyle='#344054';ctx.font='bold 14px sans-serif';
    ctx.textAlign=Math.cos(a)>.25?'left':Math.cos(a)<-.25?'right':'center';
    ctx.textBaseline=Math.sin(a)>.35?'top':Math.sin(a)<-.35?'bottom':'middle';
    ctx.fillText(d.name||`영역 ${i+1}`,lx,ly);
  });
  plot('pre',blue);plot('post',red);
  updateSummary();
}
function plot(key,color){
  const n=data.length,cx=canvas.width/2,cy=canvas.height/2+5,radius=Math.min(canvas.width*.34,canvas.height*.34);
  ctx.beginPath();
  data.forEach((d,i)=>{
    const v=validScore(d[key]),a=-Math.PI/2+i*2*Math.PI/n;
    const x=cx+Math.cos(a)*radius*v/100,y=cy+Math.sin(a)*radius*v/100;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.closePath();ctx.fillStyle=color+'25';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();
  data.forEach((d,i)=>{
    const v=validScore(d[key]),a=-Math.PI/2+i*2*Math.PI/n;
    const x=cx+Math.cos(a)*radius*v/100,y=cy+Math.sin(a)*radius*v/100;
    ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();
  });
}
function updateSummary(){
  const valid=data.filter(d=>d.name.trim()!=='');
  if(!valid.length){document.getElementById('summary').innerHTML='평가 영역과 점수를 입력하면 분석 요약이 표시됩니다.';return;}
  const diffs=valid.map(d=>({name:d.name,delta:validScore(d.post)-validScore(d.pre)}));
  const avgPre=valid.reduce((s,d)=>s+validScore(d.pre),0)/valid.length;
  const avgPost=valid.reduce((s,d)=>s+validScore(d.post),0)/valid.length;
  const avgDiff=avgPost-avgPre;
  const max=diffs.reduce((a,b)=>b.delta>a.delta?b:a);
  const min=diffs.reduce((a,b)=>b.delta<a.delta?b:a);
  const improved=diffs.filter(d=>d.delta>0).length, same=diffs.filter(d=>d.delta===0).length, declined=diffs.filter(d=>d.delta<0).length;
  let msg=avgDiff>0?`평균 점수가 <strong>${avgDiff.toFixed(1)}점 상승</strong>했습니다.`:avgDiff<0?`평균 점수가 <strong>${Math.abs(avgDiff).toFixed(1)}점 하락</strong>했습니다.`:'평균 점수에 변화가 없습니다.';
  document.getElementById('summary').innerHTML=`<strong>③ 분석 요약</strong><br>
    사전 평균: ${avgPre.toFixed(1)}점 → 사후 평균: ${avgPost.toFixed(1)}점<br>${msg}<br>
    향상 ${improved}개 영역 · 유지 ${same}개 영역 · 하락 ${declined}개 영역<br>
    가장 크게 향상된 영역: <strong>${escapeHtml(max.name)} (${max.delta>0?'+':''}${max.delta}점)</strong><br>
    변화가 가장 작은 영역: ${escapeHtml(min.name)} (${min.delta>0?'+':''}${min.delta}점)`;
}
document.getElementById('add').addEventListener('click',()=>{data.push({name:`새 영역 ${data.length+1}`,pre:0,post:0});renderRows();});
document.getElementById('reset').addEventListener('click',()=>{data=initial.map(x=>({name:x[0],pre:x[1],post:x[2]}));renderRows();});
document.getElementById('save').addEventListener('click',()=>{
  const link=document.createElement('a');link.download='학생역량_사전사후_레이더차트.png';link.href=canvas.toDataURL('image/png');link.click();
});
document.getElementById('copy').addEventListener('click',async()=>{
  const text=document.getElementById('summary').innerText;
  try{await navigator.clipboard.writeText(text);alert('분석 요약을 복사했습니다.');}
  catch(e){alert('복사할 수 없습니다. 요약 텍스트를 직접 선택해 주세요.');}
});
renderRows();
</script>
</body>
</html>

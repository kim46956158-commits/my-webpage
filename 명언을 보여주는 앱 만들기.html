<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마음 쉼표 - 감정 맞춤 명언 추천</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emotion: {
                            joy: '#F59E0B',
                            happy: '#EC4899',
                            sad: '#3B82F6',
                            depressed: '#6366F1',
                            exhausted: '#8B5CF6',
                            burnout: '#D946EF',
                            anxiety: '#10B981',
                            stress: '#14B8A6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Gowun Batang & Pretendard fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .font-serif-kr { font-family: 'Gowun Batang', serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }

        .fade-in {
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glassmorphism utility */
        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-200 dark:selection:bg-amber-900">

    <!-- Header Navigation -->
    <header class="w-full max-w-3xl mx-auto px-4 py-4 sm:py-6 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-rose-400 shadow-md flex items-center justify-center text-white text-lg">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-500 bg-clip-text text-transparent">마음 쉼표</h1>
                <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 font-medium">당신의 오늘을 다독이는 따뜻한 한 문장</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Theme Toggle -->
            <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-600 dark:text-amber-400 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="다크/라이트 모드">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <!-- Favorites Modal Trigger -->
            <button onclick="openFavoritesModal()" class="px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-slate-200 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                <i class="fa-solid fa-bookmark text-rose-500"></i>
                <span class="hidden sm:inline">보관함</span>
            </button>
            <!-- Manager Modal Trigger -->
            <button onclick="openManageModal()" class="px-3 py-2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-xl shadow-sm text-xs sm:text-sm font-semibold flex items-center gap-1.5 hover:bg-slate-800 dark:hover:bg-white transition">
                <i class="fa-solid fa-sliders"></i>
                <span class="hidden sm:inline">명언 관리</span>
            </button>
        </div>
    </header>

    <!-- Main Section -->
    <main class="w-full max-w-2xl mx-auto px-4 my-auto py-2 flex flex-col items-center">

        <!-- 8 Emotional States Selection Grid -->
        <section class="w-full mb-6">
            <div class="flex items-center justify-between mb-2.5">
                <span class="text-xs sm:text-sm font-bold text-slate-600 dark:text-slate-300">오늘 어떤 마음이 드시나요?</span>
                <span class="text-[11px] text-slate-400 dark:text-slate-500">8가지 감정 카테고리</span>
            </div>
            
            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                <button onclick="selectEmotion('joy')" id="btn-joy" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">😊</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">기쁨</span>
                </button>
                <button onclick="selectEmotion('happy')" id="btn-happy" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">💖</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">행복</span>
                </button>
                <button onclick="selectEmotion('sad')" id="btn-sad" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">🌧️</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">슬픔</span>
                </button>
                <button onclick="selectEmotion('depressed')" id="btn-depressed" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">🥀</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">우울</span>
                </button>
                <button onclick="selectEmotion('exhausted')" id="btn-exhausted" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">🔋</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">지침</span>
                </button>
                <button onclick="selectEmotion('burnout')" id="btn-burnout" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">😮‍💨</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">번아웃</span>
                </button>
                <button onclick="selectEmotion('anxiety')" id="btn-anxiety" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">🍃</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">불안</span>
                </button>
                <button onclick="selectEmotion('stress')" id="btn-stress" class="emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all">
                    <span class="text-xl sm:text-2xl">⚡</span>
                    <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">스트레스</span>
                </button>
            </div>
        </section>

        <!-- Main Quote Display Card -->
        <section class="w-full">
            <div id="cardContainer" class="glass-card bg-white/80 dark:bg-slate-900/80 border border-slate-200/80 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl relative overflow-hidden flex flex-col justify-between min-h-[300px] sm:min-h-[340px] transition-all">
                
                <!-- Background Decorative Quote Icon -->
                <div class="absolute -top-6 -right-3 text-slate-100 dark:text-slate-800/50 text-9xl font-serif select-none pointer-events-none">
                    “
                </div>

                <!-- Card Header Info -->
                <div class="flex items-center justify-between mb-4 z-10">
                    <span id="quoteCategoryBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-colors">
                        <!-- Loaded dynamically -->
                    </span>
                    <span id="quoteCounter" class="text-[11px] font-semibold text-slate-400 dark:text-slate-500">
                        <!-- e.g., 1 / 20 -->
                    </span>
                </div>

                <!-- Quote Body -->
                <div id="quoteContentContainer" class="my-auto py-3 text-center z-10 fade-in">
                    <p id="quoteText" class="font-serif-kr text-lg sm:text-2xl font-bold text-slate-800 dark:text-slate-100 leading-relaxed sm:leading-loose mb-4">
                        <!-- Quote Text -->
                    </p>
                    <p id="quoteAuthor" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium">
                        <!-- Author -->
                    </p>
                </div>

                <!-- Card Action Controls -->
                <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800/80 flex flex-col sm:flex-row gap-2.5 items-center justify-between z-10">
                    <button onclick="getRandomQuote()" class="w-full sm:w-auto flex-1 py-3 px-5 bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 text-white font-bold rounded-2xl shadow-md text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-[0.98] transition">
                        <i class="fa-solid fa-shuffle text-amber-400 dark:text-amber-600"></i>
                        <span>다른 명언 보기</span>
                    </button>
                    
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="toggleFavoriteCurrent()" id="btnFavorite" class="flex-1 sm:flex-none py-3 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-1.5 active:scale-95 transition">
                            <i id="favIcon" class="fa-regular fa-heart text-rose-500"></i>
                            <span>보관</span>
                        </button>
                        <button onclick="copyQuote()" class="flex-1 sm:flex-none py-3 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-1.5 active:scale-95 transition">
                            <i class="fa-regular fa-copy"></i>
                            <span>복사</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl mx-auto px-4 py-4 text-center text-xs text-slate-400 dark:text-slate-600">
        마음 쉼표 &copy; 2026. 지친 일상에 온기를 건네는 조각 문장들.
    </footer>

    <!-- Toast Popup Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 opacity-0 pointer-events-none transform translate-y-4 z-50 text-xs sm:text-sm font-medium transition-all duration-300">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMsg">복사되었습니다.</span>
    </div>

    <!-- ==================== FAVORITES MODAL ==================== -->
    <div id="favoritesModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex justify-center items-end sm:items-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 overflow-hidden" id="favModalContainer">
            
            <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-heart text-rose-500"></i>
                    <h2 class="font-bold text-slate-800 dark:text-slate-100 text-sm sm:text-base">나의 보관함 (즐겨찾기)</h2>
                </div>
                <button onclick="closeFavoritesModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="favoritesList" class="p-4 sm:p-5 flex-1 overflow-y-auto space-y-2.5">
                <!-- Dynamic List -->
            </div>
        </div>
    </div>

    <!-- ==================== QUOTE MANAGEMENT MODAL ==================== -->
    <div id="manageModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex justify-center items-end sm:items-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 overflow-hidden" id="manageModalContainer">
            
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-slate-600 dark:text-slate-400"></i>
                    <h2 class="font-bold text-slate-800 dark:text-slate-100 text-sm sm:text-base">명언 데이터베이스 관리</h2>
                </div>
                <button onclick="closeManageModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 sm:p-5 flex-1 overflow-y-auto space-y-5">
                
                <!-- Add New Quote Form -->
                <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 space-y-3">
                    <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-plus text-amber-500"></i>
                        <span>새로운 명언 추가하기</span>
                    </h3>
                    <div class="space-y-2">
                        <select id="newQuoteCategory" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm font-medium outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="joy">😊 기쁨</option>
                            <option value="happy">💖 행복</option>
                            <option value="sad">🌧️ 슬픔</option>
                            <option value="depressed">🥀 우울</option>
                            <option value="exhausted">🔋 지침</option>
                            <option value="burnout">😮‍💨 번아웃</option>
                            <option value="anxiety">🍃 불안</option>
                            <option value="stress">⚡ 스트레스</option>
                        </select>
                        <textarea id="newQuoteText" rows="2" placeholder="마음에 남는 명언 문구를 입력해 주세요." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
                        <input type="text" id="newQuoteAuthor" placeholder="발언자/출처 (예: 찰리 채플린)" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-amber-500">
                        <button onclick="addNewQuote()" class="w-full py-2.5 bg-slate-900 dark:bg-slate-100 hover:bg-slate-800 dark:hover:bg-white text-white dark:text-slate-900 font-bold rounded-xl text-xs sm:text-sm transition">
                            명언 추가하기
                        </button>
                    </div>
                </div>

                <!-- Filter & List Header -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-700 dark:text-slate-300">등록된 명언 목록</span>
                        <select id="manageFilterCategory" onchange="renderManageList()" class="px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-medium">
                            <option value="all">전체 카테고리</option>
                            <option value="joy">기쁨</option>
                            <option value="happy">행복</option>
                            <option value="sad">슬픔</option>
                            <option value="depressed">우울</option>
                            <option value="exhausted">지침</option>
                            <option value="burnout">번아웃</option>
                            <option value="anxiety">불안</option>
                            <option value="stress">스트레스</option>
                        </select>
                    </div>

                    <!-- Dynamic Quote List -->
                    <div id="manageQuoteList" class="space-y-2 max-h-[260px] overflow-y-auto pr-1">
                        <!-- Rendered by JS -->
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="p-3 bg-slate-50 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800 text-center">
                <button onclick="resetDefaultQuotes()" class="text-xs text-slate-400 hover:text-red-500 dark:hover:text-red-400 underline transition">
                    초기 데이터로 복원하기
                </button>
            </div>

        </div>
    </div>

    <!-- Application Script -->
    <script>
        // 160+ Curated Quotes across 8 Emotional Categories (20+ each)
        const DEFAULT_QUOTES = {
            joy: [
                { id: 101, text: "웃음은 두 사람 사이의 가장 가까운 거리다.", author: "빅토르 보르게" },
                { id: 102, text: "오늘 가장 웃은 날이 가장 좋은 날이다.", author: "찰리 채플린" },
                { id: 103, text: "기쁨은 행동의 에너지이며, 밝은 마음은 기적을 부른다.", author: "랄프 월도 에머슨" },
                { id: 104, text: "기분 좋은 생각이 당신의 하루를 빛나게 만드는 가장 강력한 자석이다.", author: "오프라 윈프리" },
                { id: 105, text: "당신의 웃음은 세상을 더 따뜻하게 만드는 햇살과 같다.", author: "틱낫한" },
                { id: 106, text: "기쁨을 가꾸는 자에게 삶은 언제나 선물이다.", author: "스피노자" },
                { id: 107, text: "웃음은 마음의 치료제이자 마음을 맑게 하는 샘물이다.", author: "토마스 카를라일" },
                { id: 108, text: "기쁨은 나누면 두 배가 된다.", author: "독일 속담" },
                { id: 109, text: "인생은 미소 짓는 사람에게 더 큰 미소로 답한다.", author: "루이 암스트롱" },
                { id: 110, text: "작은 기쁨들을 모으다 보면 거대한 행복의 성이 완공된다.", author: "토마스 아퀴나스" },
                { id: 111, text: "맑은 날씨처럼 밝은 마음은 주변 모든 이들을 편안하게 해준다.", author: "워싱턴 어빙" },
                { id: 112, text: "즐거움은 감사함에서 시작된다.", author: "C.S. 루이스" },
                { id: 113, text: "당신이 활짝 웃을 때 우주 전체가 당신 편에 선다.", author: "파울로 코엘료" },
                { id: 114, text: "기쁨은 순간에 있지만, 그 기억은 영원히 마음을 밝힌다.", author: "워즈워스" },
                { id: 115, text: "오늘 하루 마음에 작은 꽃 하나를 심는 기분으로 웃어보자.", author: "나태주" },
                { id: 116, text: "마음이 즐거우면 보도블록 사이의 풀 한 포기도 아름답다.", author: "괴테" },
                { id: 117, text: "밝은 에너지는 그 자체로 가장 강력한 동기부여다.", author: "스티븐 코비" },
                { id: 118, text: "기쁨을 표현하기에 너무 늦은 때란 없다.", author: "에이미 탄" },
                { id: 119, text: "당신의 즐거운 표정이 오늘 누군가에게 구원이 될 수 있다.", author: "마더 테레사" },
                { id: 120, text: "인생의 가장 큰 묘미는 순수한 순간의 환희를 만끽하는 것이다.", author: "니체" }
            ],
            happy: [
                { id: 201, text: "행복은 만들어지는 것이다. 당신의 행동에서 나온다.", author: "달라이 라마" },
                { id: 202, text: "행복이란 당신이 생각하는 것, 말하는 것, 하는 것이 조화를 이룰 때 찾아온다.", author: "마하트마 간디" },
                { id: 203, text: "가장 큰 행복은 사랑하고 사랑받는 것이다.", author: "조지 산드" },
                { id: 204, text: "행복은 멀리 있지 않다. 당신 마음속 소소한 감사를 발견할 때 피어난다.", author: "헬렌 켈러" },
                { id: 205, text: "행복의 문 하나가 닫히면 다른 문이 열린다.", author: "헬렌 켈러" },
                { id: 206, text: "행복은 선택이다. 오늘 하루 좋은 것들을 바라보기로 결심하자.", author: "아리스토텔레스" },
                { id: 207, text: "지금 누리는 이 순간의 평화와 행복이 당신의 진짜 자산이다.", author: "마르쿠스 아우렐리우스" },
                { id: 208, text: "행복한 사람은 가진 것에 감사하고, 불행한 사람은 없는 것을 갈망한다.", author: "에픽테토스" },
                { id: 209, text: "행복은 내가 좋아하는 것을 하는 것이 아니라, 하는 것을 좋아하는 것이다.", author: "레프 Толстой" },
                { id: 210, text: "우리가 행복해지기 위해 필요한 것은 아주 적다. 그것은 바로 우리 마음가짐이다.", author: "세네카" },
                { id: 211, text: "행복은 향수와 같다. 자신에게 먼저 뿌리지 않고는 남에게 뿌릴 수 없다.", author: "에머슨" },
                { id: 212, text: "행복하게 사는 비결은 단순함에 있다.", author: "소로" },
                { id: 213, text: "남을 행복하게 해주는 것은 내 영혼에 따뜻한 난로를 놓는 일이다.", author: "프랭클린" },
                { id: 214, text: "소소한 것에 큰 의미를 둘 때 행복의 지평이 넓어진다.", author: "스탕달" },
                { id: 215, text: "행복은 성취의 기쁨과 창조적 노력이 주는 감동 속에 있다.", author: "루즈벨트" },
                { id: 216, text: "행복한 삶의 비결은 자유이고, 자유의 비결은 용기다.", author: "투키디데스" },
                { id: 217, text: "내가 걸어가는 이 길 위의 파란 하늘만으로도 참 행복하다.", author: "윤동주" },
                { id: 218, text: "행복을 추구하지 말고, 순간순간을 충실히 살아라. 그럼 행복이 뒤따른다.", author: "빅터 프랭클" },
                { id: 219, text: "행복의 비밀은 더 많이 탐하는 것이 아니라 더 적게 바라는 데 있다.", author: "소크라테스" },
                { id: 220, text: "당신이 미소 지을 때 세상도 행복하게 함께 웃는다.", author: "파울로 코엘료" }
            ],
            sad: [
                { id: 301, text: "슬픔을 아는 사람만이 타인의 아픔에 진심으로 공감할 수 있다.", author: "괴테" },
                { id: 302, text: "지금 흐르는 눈물은 마음의 상처를 씻어내는 영혼의 세척수다.", author: "워싱턴 어빙" },
                { id: 303, text: "우는 것을 두려워하지 마라. 눈물은 생각의 먹구름을 거둬내 줄 것이다.", author: "인디언 속담" },
                { id: 304, text: "상처는 빛이 당신에게 들어오는 통로다.", author: "루미" },
                { id: 305, text: "마음껏 슬퍼해도 괜찮다. 감정을 다 비워내야 다시 채울 자리가 생긴다.", author: "브레네 브라운" },
                { id: 306, text: "슬픔은 지나가는 구름일 뿐, 당신이라는 하늘은 변함없이 푸르다.", author: "틱낫한" },
                { id: 307, text: "울고 싶을 때는 마음껏 울어라. 눈물도 훌륭한 마음의 약이다.", author: "셰익스피어" },
                { id: 308, text: "슬픔을 통과한 유쾌함이야말로 진짜 깊이 있는 행복이다.", author: "니체" },
                { id: 309, text: "비 온 뒤에 땅이 굳어지듯, 슬픔을 지난 영혼은 단단해진다.", author: "한국 속담" },
                { id: 310, text: "당신의 눈물 한 방울에도 우주의 진심이 들어있다.", author: "김용택" },
                { id: 311, text: "밤이 깊을수록 새벽별은 더 찬란하게 빛난다.", author: "도스토옙스키" },
                { id: 312, text: "슬픔은 우리가 사랑했던 대상에 대해 바치는 고귀한 경의다.", author: "C.S. 루이스" },
                { id: 313, text: "아픔을 외면하지 말고 꼭 안아주어라. 슬픔도 당신의 소중한 일부다.", author: "정호승" },
                { id: 314, text: "비 내리는 시간을 버텨낸 나무만이 푸른 잎을 자랑한다.", author: "헤르만 헤세" },
                { id: 315, text: "지금의 슬픔은 훗날 더 아름다운 시가 되어 돌아올 것이다.", author: "푸시킨" },
                { id: 316, text: "마음의 상처가 깊다고 해서 당신의 가치가 줄어들지는 않는다.", author: "아들러" },
                { id: 317, text: "슬플 때는 억지로 참지 말고 충분히 자신을 위로해 주어라.", author: "혜민 스님" },
                { id: 318, text: "눈물 뒤에 찾아오는 평화는 그 무엇보다 달콤하다.", author: "바이런" },
                { id: 319, text: "인생의 어두운 밤에도 길을 잃지 않는 것은 소망의 촛불 덕분이다.", author: "앤 패커" },
                { id: 320, text: "슬픔은 단지 더 큰 사랑을 배울 준비 단계일 뿐이다.", author: "에릭 프롬" }
            ],
            depressed: [
                { id: 401, text: "가장 깊은 어둠 속에서 가장 밝은 별을 볼 수 있다.", author: "마틴 루터 킹" },
                { id: 402, text: "견디기 힘든 순간도 결국엔 '지나간 일'이 된다.", author: "신달자" },
                { id: 403, text: "겨울이 왔다면 봄 또한 멀지 않으리라.", author: "퍼시 비시 셸리" },
                { id: 404, text: "상처 입은 조개가 가장 아름다운 진주를 품는다.", author: "에머슨" },
                { id: 405, text: "당신이 느낀 우울은 잠시 쉬어가라는 영혼의 간곡한 요청이다.", author: "카를 융" },
                { id: 406, text: "모든 침묵과 우울 뒤에는 따스한 햇살이 숨어있다.", author: "빅토르 위고" },
                { id: 407, text: "지금 어두운 터널을 지나고 있다면 멈추지 말고 계속 걸어가라.", author: "처칠" },
                { id: 408, text: "스스로를 자책하지 마라. 당신은 이미 존재 자체로 귀하다.", author: "박노해" },
                { id: 409, text: "우울의 늪에서 벗어나는 첫 걸음은 오늘 아주 작은 한 가지를 해내는 것이다.", author: "윌리엄 제임스" },
                { id: 410, text: "당신은 혼자가 아니다. 세상 어딘가에 당신의 마음을 응원하는 이가 있다.", author: "김토끼" },
                { id: 411, text: "마음의 겨울을 지나고 나면 반드시 따스한 봄날의 꽃이 핀다.", author: "박노해" },
                { id: 412, text: "자신을 온전히 받아들이는 순간 무거운 우울도 옅어지기 시작한다.", author: "칼 로저스" },
                { id: 413, text: "희망은 깃털 달린 새처럼 우리 영혼 안에 조용히 앉아 노래한다.", author: "에밀리 디킨슨" },
                { id: 414, text: "칠흑 같은 밤에도 하늘엔 무수한 별들이 숨쉬고 있다.", author: "반 고흐" },
                { id: 415, text: "오늘 하루 무사히 보낸 것만으로도 당신은 위대한 일을 해낸 것이다.", author: "혜민 스님" },
                { id: 416, text: "우울함은 결코 당신의 정체성이 아니다. 그저 지나가는 날씨일 뿐이다.", author: "매트 헤이그" },
                { id: 417, text: "절망의 한가운데에도 언제나 새로운 시작의 씨앗이 묻혀있다.", author: "카뮈" },
                { id: 418, text: "자신을 너무 채찍질하지 마라. 가끔은 그냥 조용히 누워있어도 된다.", author: "정희재" },
                { id: 419, text: "구름 너머에는 언제나 찬란한 태양이 기다리고 있다.", author: "롱펠로" },
                { id: 420, text: "당신이라는 존재는 이 세상에 단 하나뿐인 소중한 빛이다.", author: "엘리노어 루즈벨트" }
            ],
            exhausted: [
                { id: 501, text: "쉬어가는 것은 길을 잃은 것이 아니라, 더 먼 길을 가기 위한 준비다.", author: "앤 패커" },
                { id: 502, text: "나무도 겨울에는 잎을 떨어뜨리고 쉼을 가진다. 당신도 쉬어도 된다.", author: "혜민 스님" },
                { id: 503, text: "멈추면 비로소 보이는 것들이 있다.", author: "혜민 스님" },
                { id: 504, text: "휴식은 게으름이 아니다. 당신의 에너지 통을 다시 채우는 시간이다.", author: "존 러브록" },
                { id: 505, text: "모든 것을 당장 해결하려 하지 마라. 오늘은 그냥 숨을 고르는 것으로 충분하다.", author: "나태주" },
                { id: 506, text: "아무것도 하지 않는 것도 가치 있는 일이다.", author: "어린 왕자" },
                { id: 507, text: "당신은 이미 충분히 애썼고, 잘해왔다.", author: "정희재" },
                { id: 508, text: "속도보다 중요한 것은 방향이고, 방향보다 중요한 것은 내 마음의 평화다.", author: "괴테" },
                { id: 509, text: "열심히 달렸다면 느리게 걷는 시간도 스스로에게 선물해야 한다.", author: "한강" },
                { id: 510, text: "지친 마음에는 질 좋은 수면과 따뜻한 찻잔이 약이다.", author: "쇼펜하우어" },
                { id: 511, text: "너무 잘하려 애쓰지 마라. 적당히 하는 것이 오래가는 비결이다.", author: "이외수" },
                { id: 512, text: "당신이 쉬는 동안에도 세상은 무너지지 않는다. 안심하고 쉬어라.", author: "오스카 와일드" },
                { id: 513, text: "지친 나에게 오늘 가장 필요한 것은 따뜻한 칭찬 한마디다.", author: "루이즈 헤이" },
                { id: 514, text: "쉼이 없는 삶은 악보에 음표만 가득하고 쉼표가 없는 곡과 같다.", author: "존 러스킨" },
                { id: 515, text: "자연은 서두르는 법이 없지만 모든 것을 완수한다. 당신도 느려도 괜찮다.", author: "노자" },
                { id: 516, text: "에너지가 고갈되었을 땐 무리해서 당기지 말고 기어를 중립에 두어라.", author: "토니 슈워츠" },
                { id: 517, text: "충전 없는 스마트폰이 꺼지듯, 휴식 없는 사람도 방전된다.", author: "현대 명언" },
                { id: 518, text: "오늘 밤은 모든 걱정을 내려놓고 깊고 평온한 잠에 들기를.", author: "달라이 라마" },
                { id: 519, text: "나를 사랑하는 첫 번째 단계는 지친 몸과 마음에 쉬어갈 틈을 주는 것이다.", author: "브레네 브라운" },
                { id: 520, text: "느긋하게 거닐 때 생각지도 못한 좋은 아이디어가 피어난다.", author: "아리스토텔레스" }
            ],
            burnout: [
                { id: 601, text: "지쳤을 때는 포기하고 싶어지지만, 그건 단지 쉼이 필요하다는 신호일 뿐이다.", author: "뱅크시" },
                { id: 602, text: "완벽하지 않아도 괜찮다. 지금 모습 그대로 당신은 충분히 가치 있다.", author: "아들러" },
                { id: 603, text: "남과 비교하며 자신을 채찍질하지 마라. 당신만의 속도가 있다.", author: "알렌 폰 트리스" },
                { id: 604, text: "세상의 기대에 부응하려 애쓰지 마라. 당신의 삶은 당신의 것이다.", author: "장자" },
                { id: 605, text: "마음이 번아웃되었을 때는 그저 가만히 자신의 호흡을 느껴보라.", author: "틱낫한" },
                { id: 606, text: "오늘의 쉼이 내일의 기적을 만든다.", author: "스티븐 코비" },
                { id: 607, text: "불꽃을 멈추어야 비로소 그을린 자리가 식는다. 잠시 일에서 손을 떼라.", author: "차드 멩 탄" },
                { id: 608, text: "모든 사람을 만족시킬 수는 없다. 나 자신을 먼저 만족시켜라.", author: "니체" },
                { id: 609, text: "무너짐은 새로운 시작을 의미한다. 다시 차곡차곡 쌓아가면 된다.", author: "파울로 코엘료" },
                { id: 610, text: "열정이 식었다고 자책하지 마라. 불꽃도 다시 연료를 넣어야 피어오른다.", author: "에릭 토마스" },
                { id: 611, text: "자신의 한계를 인정하는 것은 약함이 아니라 지혜로움이다.", author: "소크라테스" },
                { id: 612, text: "목표에 도달하는 것보다 중요한 것은 가는 과정에서 나를 잃지 않는 것이다.", author: "헤르만 헤세" },
                { id: 613, text: "타인의 시선이라는 감옥에서 벗어날 때 진정한 자유와 쉼이 찾아온다.", author: "쇼펜하우어" },
                { id: 614, text: "번아웃은 당신이 너무 오래 강한 척을 해왔다는 증거다.", author: "정희재" },
                { id: 615, text: "당신의 가치는 생산성으로 측정되지 않는다.", author: "티시 해리슨 윗렌" },
                { id: 616, text: "마음의 배터리가 1%일 때는 모든 스위치를 끄고 충전 단자만 꽂아두어라.", author: "김상현" },
                { id: 617, text: "스스로에게 'NO'라고 말할 수 있는 용기가 필요할 때다.", author: "스티븐 코비" },
                { id: 618, text: "길을 잃었다는 느낌이 들 땐, 제일 가까운 의자에 앉아 하늘을 바라보라.", author: "나태주" },
                { id: 619, text: "모든 일을 혼자 짊어지려 하지 마라. 도움을 요청하는 것도 능력이다.", author: "카네기" },
                { id: 620, text: "오늘 하루는 아무 생산적인 일을 하지 않아도 만점이다.", author: "곰돌이 푸" }
            ],
            anxiety: [
                { id: 701, text: "우리가 걱정하는 것의 90%는 일어나지 않을 일이다.", author: "데일 카네기" },
                { id: 702, text: "불안은 내일의 슬픔을 덜어주는 것이 아니라, 오늘의 힘을 앗아갈 뿐이다.", author: "찰스 스퍼전" },
                { id: 703, text: "천천히 가도 괜찮다. 멈추지만 않는다면 결국 목표에 도달한다.", author: "공자" },

                { id: 717, text: "불안을 없애려 애쓰지 말고 그대로 안고 걸어가라. 어느새 사라져 있을 것이다.", author: "모리타 쇼마" },

                { id: 720, text: "평정심은 폭풍 속에서도 중심을 잡는 조용한 확신이다.", author: "마르쿠스 아우렐리우스" }

                { id: 802, text: "숨을 크게 쉬어라. 내쉬는 숨에 당신을 괴롭히는 모든 중압감을 실어 보내라.", author: "틱낫한" },
                { id: 803, text: "용기란 두려움이 없는 것이 아니라, 두려움에도 불구하고 진행하는 것이다.", author: "넬슨 만델라" },

                { id: 805, text: "어두운 밤을 지새운 사람만이 붉게 타오르는 일출을 만날 수 있다.", author: "빅토르 위고" },
                { id: 806, text: "남의 시선에 당신의 가치를 맡기지 마라.", author: "라신" },

                { id: 808, text: "오늘 당신을 강하게 자극하는 문제도 1년 뒤에는 아련한 추억일 뿐이다.", author: "리차드 칼슨" },
                { id: 809, text: "스트레스를 받을 땐 조용히 물 한 잔을 마시며 10초간 숫자를 세어보아라.", author: "윌리엄 제임스" },
                { id: 810, text: "문제를 바꿀 수 없다면 그 문제를 대하는 당신의 태도를 바꾸어라.", author: "마야 안젤루" },
                { id: 811, text: "완벽함이 아닌 성장에 집중할 때 스트레스의 사슬이 풀린다.", author: "캐럴 드벡" },
                { id: 812, text: "당신의 마음은 정원이다. 스트레스라는 잡초를 뽑고 평화의 꽃을 심어라.", author: "제임스 앨런" },
                { id: 813, text: "자연 속에 10분만 머물러도 몸과 마음의 긴장이 완화된다.", author: "존 뮤어" },
                { id: 814, text: "압박감 속에서도 웃을 수 있다면 당신은 승리자다.", author: "헤밍웨이" },
                { id: 815, text: "화가 나거나 긴장될 때 즉각적인 반응을 멈추고 3초간 머물러라.", author: "타샤 튜더" },
                { id: 816, text: "긴장된 몸을 이완시키는 가장 확실한 방법은 따뜻한 목욕과 음악이다.", author: "히포크라테스" },
                { id: 817, text: "스트레스는 내 마음의 주도권을 남에게 내어주었을 때 생겨난다.", author: "웨인 다이어" },
                { id: 818, text: "단단하게 굳은 나무는 부러지지만 유연한 대나무는 바람에 꺾이지 않는다.", author: "노자" },
                { id: 819, text: "나를 긴장시키는 일일수록 단순하게 분해하여 처리하라.", author: "데일 카네기" },
                { id: 820, text: "오늘 하루, 마음을 무겁게 누르던 짐 하나를 과감히 던져버리자.", author: "김수환 추기경" }
            ]
        };

        // Category Metadata Configuration
        const EMOTIONS_CONFIG = {
            joy: { name: '기쁨', emoji: '😊', badgeBg: 'bg-amber-100 dark:bg-amber-950/60', badgeText: 'text-amber-800 dark:text-amber-300', border: 'border-amber-400', theme: 'from-amber-400 to-amber-600' },
            happy: { name: '행복', emoji: '💖', badgeBg: 'bg-pink-100 dark:bg-pink-950/60', badgeText: 'text-pink-800 dark:text-pink-300', border: 'border-pink-400', theme: 'from-pink-400 to-rose-500' },
            sad: { name: '슬픔', emoji: '🌧️', badgeBg: 'bg-blue-100 dark:bg-blue-950/60', badgeText: 'text-blue-800 dark:text-blue-300', border: 'border-blue-400', theme: 'from-blue-400 to-indigo-500' },
            depressed: { name: '우울', emoji: '🥀', badgeBg: 'bg-indigo-100 dark:bg-indigo-950/60', badgeText: 'text-indigo-800 dark:text-indigo-300', border: 'border-indigo-400', theme: 'from-indigo-500 to-purple-600' },
            exhausted: { name: '지침', emoji: '🔋', badgeBg: 'bg-purple-100 dark:bg-purple-950/60', badgeText: 'text-purple-800 dark:text-purple-300', border: 'border-purple-400', theme: 'from-purple-400 to-fuchsia-500' },
            burnout: { name: '번아웃', emoji: '😮‍💨', badgeBg: 'bg-fuchsia-100 dark:bg-fuchsia-950/60', badgeText: 'text-fuchsia-800 dark:text-fuchsia-300', border: 'border-fuchsia-400', theme: 'from-fuchsia-500 to-pink-500' },
            anxiety: { name: '불안', emoji: '🍃', badgeBg: 'bg-emerald-100 dark:bg-emerald-950/60', badgeText: 'text-emerald-800 dark:text-emerald-300', border: 'border-emerald-400', theme: 'from-emerald-400 to-teal-500' },
            stress: { name: '스트레스', emoji: '⚡', badgeBg: 'bg-teal-100 dark:bg-teal-950/60', badgeText: 'text-teal-800 dark:text-teal-300', border: 'border-teal-400', theme: 'from-teal-400 to-cyan-500' }
        };

        // Application State Variables
        let quotesDb = {};
        let favoritesList = [];
        let currentEmotion = 'joy';
        let currentQuote = null;
        let lastQuoteId = null;

        // Initialize App on Page Load
        function initApp() {
            // Load Dark Mode Preference
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }

            // Load Quotes Data
            const savedQuotes = localStorage.getItem('quotes_db_v2');
            if (savedQuotes) {
                try { quotesDb = JSON.parse(savedQuotes); } 
                catch(e) { quotesDb = JSON.parse(JSON.stringify(DEFAULT_QUOTES)); }
            } else {
                quotesDb = JSON.parse(JSON.stringify(DEFAULT_QUOTES));
                saveQuotesToStorage();
            }

            // Load Favorites Data
            const savedFavs = localStorage.getItem('quotes_favorites_v2');
            if (savedFavs) {
                try { favoritesList = JSON.parse(savedFavs); } catch(e) { favoritesList = []; }
            }

            selectEmotion('joy');
        }

        // Theme Toggle
        function toggleDarkMode() {
            const htmlClass = document.documentElement.classList;
            const icon = document.getElementById('themeIcon');
            if (htmlClass.contains('dark')) {
                htmlClass.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = 'fa-solid fa-moon';
            } else {
                htmlClass.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = 'fa-solid fa-sun';
            }
        }

        function saveQuotesToStorage() {
            localStorage.setItem('quotes_db_v2', JSON.stringify(quotesDb));
        }

        function saveFavoritesToStorage() {
            localStorage.setItem('quotes_favorites_v2', JSON.stringify(favoritesList));
        }

        // Select Emotion & Update Interface
        function selectEmotion(emotionKey) {
            currentEmotion = emotionKey;
            const config = EMOTIONS_CONFIG[emotionKey];

            // Highlight Active Emotion Button
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.className = 'emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 transition-all opacity-80 hover:opacity-100';
            });

            const activeBtn = document.getElementById(`btn-${emotionKey}`);
            if (activeBtn) {
                activeBtn.className = `emotion-btn p-2 sm:p-2.5 rounded-2xl bg-white dark:bg-slate-900 border-2 ${config.border} shadow-md flex flex-col items-center justify-center gap-1 transition-all opacity-100 scale-105`;
            }

            // Update Badge Header
            const badge = document.getElementById('quoteCategoryBadge');
            badge.className = `inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${config.badgeBg} ${config.badgeText}`;
            badge.innerHTML = `<span>${config.emoji}</span><span>${config.name}</span>`;

            // Draw Quote
            getRandomQuote();
        }

        // Random Quote Sampler
        function getRandomQuote() {
            const list = quotesDb[currentEmotion] || [];
            if (list.length === 0) {
                currentQuote = null;
                renderQuoteDisplay("해당 감정에 등록된 명언이 없습니다. 명언 관리에서 새로 추가해 주세요!", "마음 쉼표");
                document.getElementById('quoteCounter').innerText = `0 / 0`;
                updateFavoriteButtonState();
                return;
            }

            let randomIndex;
            if (list.length > 1) {
                do {
                    randomIndex = Math.floor(Math.random() * list.length);
                } while (list[randomIndex].id === lastQuoteId);
            } else {
                randomIndex = 0;
            }

            currentQuote = list[randomIndex];
            lastQuoteId = currentQuote.id;

            renderQuoteDisplay(currentQuote.text, currentQuote.author);
            document.getElementById('quoteCounter').innerText = `${randomIndex + 1} / ${list.length}`;
            updateFavoriteButtonState();
        }

        function renderQuoteDisplay(text, author) {
            const container = document.getElementById('quoteContentContainer');
            container.classList.remove('fade-in');
            void container.offsetWidth; // Restart animation

            document.getElementById('quoteText').innerText = `"${text}"`;
            document.getElementById('quoteAuthor').innerText = `― ${author || '작자 미상'}`;

            container.classList.add('fade-in');
        }

        // Favorite Toggle Feature
        function toggleFavoriteCurrent() {
            if (!currentQuote) return;

            const index = favoritesList.findIndex(item => item.id === currentQuote.id);
            if (index >= 0) {
                favoritesList.splice(index, 1);
                showToast('보관함에서 제거되었습니다.');
            } else {
                favoritesList.push({
                    ...currentQuote,
                    categoryKey: currentEmotion
                });
                showToast('보관함에 저장되었습니다! ❤️');
            }
            saveFavoritesToStorage();
            updateFavoriteButtonState();
        }

        function updateFavoriteButtonState() {
            const icon = document.getElementById('favIcon');
            const btn = document.getElementById('btnFavorite');
            if (!currentQuote) return;

            const isFav = favoritesList.some(item => item.id === currentQuote.id);
            if (isFav) {
                icon.className = 'fa-solid fa-heart text-rose-500';
                btn.classList.add('bg-rose-50', 'dark:bg-rose-950/40');
            } else {
                icon.className = 'fa-regular fa-heart text-rose-500';
                btn.classList.remove('bg-rose-50', 'dark:bg-rose-950/40');
            }
        }

        // Copy Clipboard Logic
        function copyQuote() {
            const text = document.getElementById('quoteText').innerText;
            const author = document.getElementById('quoteAuthor').innerText;
            const fullStr = `${text} ${author} [마음 쉼표]`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fullStr).then(() => {
                    showToast('명언이 클립보드에 복사되었습니다.');
                }).catch(() => fallbackCopy(fullStr));
            } else {
                fallbackCopy(fullStr);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('명언이 클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.', true);
            }
            document.body.removeChild(textArea);
        }

        // Toast Feedback
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = isError 
                ? 'fa-solid fa-circle-exclamation text-amber-400 dark:text-amber-500' 
                : 'fa-solid fa-circle-check text-emerald-400 dark:text-emerald-500';

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2300);
        }

        /* ==================== FAVORITES MODAL LOGIC ==================== */
        function openFavoritesModal() {
            const modal = document.getElementById('favoritesModal');
            const container = document.getElementById('favModalContainer');

            renderFavoritesList();

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            container.classList.remove('translate-y-full');
            container.classList.add('translate-y-0');
        }

        function closeFavoritesModal() {
            const modal = document.getElementById('favoritesModal');
            const container = document.getElementById('favModalContainer');

            container.classList.remove('translate-y-0');
            container.classList.add('translate-y-full');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');

            updateFavoriteButtonState();
        }

        function renderFavoritesList() {
            const container = document.getElementById('favoritesList');
            container.innerHTML = '';

            if (favoritesList.length === 0) {
                container.innerHTML = `
                    <div class="py-12 text-center text-slate-400 dark:text-slate-600">
                        <i class="fa-regular fa-heart text-3xl mb-2"></i>
                        <p class="text-xs">아직 보관된 명언이 없습니다.</p>
                        <p class="text-[11px] text-slate-400">마음에 드는 문장에 하트 버튼을 눌러보세요!</p>
                    </div>`;
                return;
            }

            favoritesList.forEach(item => {
                const config = EMOTIONS_CONFIG[item.categoryKey] || EMOTIONS_CONFIG['joy'];
                const div = document.createElement('div');
                div.className = 'p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 flex items-start justify-between gap-3 text-xs';
                div.innerHTML = `
                    <div class="space-y-1 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded-full ${config.badgeBg} ${config.badgeText} text-[10px] font-bold">
                                ${config.emoji} ${config.name}
                            </span>
                            <span class="text-slate-400 dark:text-slate-500 text-[10px]">― ${item.author || '미상'}</span>
                        </div>
                        <p class="text-slate-800 dark:text-slate-200 font-medium leading-relaxed font-serif-kr">"${item.text}"</p>
                    </div>
                    <button onclick="removeFavorite(${item.id})" class="text-slate-300 dark:text-slate-600 hover:text-rose-500 dark:hover:text-rose-400 p-1.5 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function removeFavorite(id) {
            favoritesList = favoritesList.filter(item => item.id !== id);
            saveFavoritesToStorage();
            renderFavoritesList();
            showToast('보관함에서 삭제되었습니다.');
        }

        /* ==================== QUOTE MANAGEMENT MODAL ==================== */
        function openManageModal() {
            const modal = document.getElementById('manageModal');
            const container = document.getElementById('manageModalContainer');

            renderManageList();

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            container.classList.remove('translate-y-full');
            container.classList.add('translate-y-0');
        }

        function closeManageModal() {
            const modal = document.getElementById('manageModal');
            const container = document.getElementById('manageModalContainer');

            container.classList.remove('translate-y-0');
            container.classList.add('translate-y-full');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');

            // Refresh view
            getRandomQuote();
        }

        function renderManageList() {
            const filterCat = document.getElementById('manageFilterCategory').value;
            const listContainer = document.getElementById('manageQuoteList');
            listContainer.innerHTML = '';

            let categoriesToRender = filterCat === 'all' 
                ? ['joy', 'happy', 'sad', 'depressed', 'exhausted', 'burnout', 'anxiety', 'stress'] 
                : [filterCat];
            let totalItems = 0;

            categoriesToRender.forEach(catKey => {
                const items = quotesDb[catKey] || [];
                items.forEach(item => {
                    totalItems++;
                    const config = EMOTIONS_CONFIG[catKey];
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700/60 flex items-start justify-between gap-3 hover:border-slate-300 transition text-xs';
                    div.innerHTML = `
                        <div class="space-y-1 flex-1">
                            <div class="flex items-center gap-1.5">
                                <span class="px-2 py-0.5 rounded-full ${config.badgeBg} ${config.badgeText} text-[10px] font-bold">
                                    ${config.emoji} ${config.name}
                                </span>
                                <span class="text-slate-400 dark:text-slate-500 text-[10px]">― ${item.author || '미상'}</span>
                            </div>
                            <p class="text-slate-800 dark:text-slate-200 font-medium leading-relaxed font-serif-kr">"${item.text}"</p>
                        </div>
                        <button onclick="deleteQuote('${catKey}', ${item.id})" class="text-slate-300 dark:text-slate-600 hover:text-red-500 p-1.5 transition">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    `;
                    listContainer.appendChild(div);
                });
            });

            if (totalItems === 0) {
                listContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">등록된 명언이 없습니다.</p>`;
            }
        }

        function addNewQuote() {
            const cat = document.getElementById('newQuoteCategory').value;
            const textInput = document.getElementById('newQuoteText');
            const authorInput = document.getElementById('newQuoteAuthor');

            const text = textInput.value.trim();
            const author = authorInput.value.trim() || '작자 미상';

            if (!text) {
                showToast('명언 문구를 입력해 주세요.', true);
                return;
            }

            const newId = Date.now();
            if (!quotesDb[cat]) quotesDb[cat] = [];

            quotesDb[cat].unshift({ id: newId, text, author });
            saveQuotesToStorage();

            textInput.value = '';
            authorInput.value = '';

            renderManageList();
            showToast('새로운 명언이 등록되었습니다!');
        }

        function deleteQuote(category, id) {
            if (confirm('이 명언을 목록에서 삭제하시겠습니까?')) {
                quotesDb[category] = quotesDb[category].filter(item => item.id !== id);
                saveQuotesToStorage();
                renderManageList();
                showToast('명언이 삭제되었습니다.');
            }
        }

        function resetDefaultQuotes() {
            if (confirm('모든 명언 데이터를 기본 초기 데이터(160개 이상)로 복원하시겠습니까? (직접 추가/삭제한 내역이 초기화됩니다)')) {
                quotesDb = JSON.parse(JSON.stringify(DEFAULT_QUOTES));
                saveQuotesToStorage();
                renderManageList();
                selectEmotion(currentEmotion);
                showToast('명언 데이터가 초기화되었습니다.');
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>

            <div id="mode-fontSignature" class="hidden space-y-4">

                                <i class="fa-solid fa-check text-indigo-600 opacity-0 sig-check-icon text-xs"></i>
                            </label>

                            <label class="sig-font-option p-2.5 rounded-xl border border-slate-200 cursor-pointer flex items-center justify-between">
                                <input type="radio" name="sigFontFamily" value="'Hi Melody', cursive" onchange="updateFontSignatureCanvas()" class="hidden">
                                <span class="font-himelody text-sm font-bold">하이멜로디</span>
                                <i class="fa-solid fa-check text-indigo-600 opacity-0 sig-check-icon text-xs"></i>

                            <button type="button" onclick="setSigFontColor('#1d4ed8')" class="sigfont-color-btn w-7 h-7 rounded-full bg-blue-700"></button>

        전자 도장 & 서명 생성기 &copy; 2026. 모든 폰트는 오픈 폰트 라이선스(OFL)를 따릅니다.
    </footer>

    <!-- Toast Popup -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-full shadow-xl flex items-center space-x-2 opacity-0 pointer-events-none transform translate-y-4 z-50 text-xs sm:text-sm font-medium w-auto max-w-[90%] text-center justify-center">
        <i id="toastIcon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toastMsg">메시지</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Global App States
        let currentAppMode = 'stamp'; // 'stamp', 'drawSignature', 'fontSignature'
        let currentShape = 'circle'; 
        let currentLayout = 'vertical'; 
        let currentColor = '#D32F2F';

        // Signature Drawing State
        let isDrawing = false;
        let penColor = '#000000';
        let penWidth = 6;
        let strokeHistory = [];
        let currentStroke = [];

        // Font Signature State
        let sigFontColor = '#000000';

        const canvas = document.getElementById('sealCanvas');
        const ctx = canvas.getContext('2d');

        // Font Dynamic Ready Check
        document.fonts.ready.then(() => {
            renderCurrentMode();
        });

        // Mode Switching Logic
        function switchMode(mode) {
            currentAppMode = mode;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            document.getElementById('mode-stamp').classList.add('hidden');
            document.getElementById('mode-drawSignature').classList.add('hidden');
            document.getElementById('mode-fontSignature').classList.add('hidden');
            document.getElementById(`mode-${mode}`).classList.remove('hidden');

            const previewIcon = document.getElementById('previewModeIcon');
            const previewTitle = document.getElementById('previewTitle');
            const sigHint = document.getElementById('signatureHint');

            if (mode === 'stamp') {
                previewIcon.className = 'fa-solid fa-stamp text-red-600 mr-1.5';
                previewTitle.innerText = '도장 실시간 미리보기';
                sigHint.classList.add('hidden');
            } else if (mode === 'drawSignature') {
                previewIcon.className = 'fa-solid fa-signature text-blue-600 mr-1.5';
                previewTitle.innerText = '손서명 캔버스';
                sigHint.classList.remove('hidden');
            } else if (mode === 'fontSignature') {
                previewIcon.className = 'fa-solid fa-pen-nib text-indigo-600 mr-1.5';
                previewTitle.innerText = '캘리 서명 미리보기';
                sigHint.classList.add('hidden');
            }

            renderCurrentMode();
        }

        function renderCurrentMode() {
            if (currentAppMode === 'stamp') {
                updateCanvas();
            } else if (currentAppMode === 'drawSignature') {
                redrawSignatureCanvas();
            } else if (currentAppMode === 'fontSignature') {
                updateFontSignatureCanvas();
            }
        }

        /* ==================== SIGNATURE DRAWING ENGINE ==================== */
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (currentAppMode !== 'drawSignature') return;
            isDrawing = true;
            const pos = getCanvasPos(e);
            currentStroke = [{ x: pos.x, y: pos.y }];
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing || currentAppMode !== 'drawSignature') return;
            const pos = getCanvasPos(e);
            currentStroke.push({ x: pos.x, y: pos.y });

            ctx.lineWidth = penWidth;
            ctx.strokeStyle = penColor;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const len = currentStroke.length;
            if (len >= 2) {
                const p1 = currentStroke[len - 2];
                const p2 = currentStroke[len - 1];
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
            e.preventDefault();
        }

        function stopDrawing(e) {
            if (!isDrawing || currentAppMode !== 'drawSignature') return;
            isDrawing = false;
            if (currentStroke.length > 0) {
                strokeHistory.push({
                    color: penColor,
                    width: penWidth,
                    points: [...currentStroke]
                });
                currentStroke = [];
            }
            if (e) e.preventDefault();
        }

        function redrawSignatureCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeHistory.forEach(stroke => {
                if (stroke.points.length < 2) return;
                ctx.lineWidth = stroke.width;
                ctx.strokeStyle = stroke.color;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                ctx.stroke();
            });
        }

        function undoSignature() {
            if (strokeHistory.length > 0) {
                strokeHistory.pop();
                redrawSignatureCanvas();
            }
        }

        function clearSignatureCanvas() {
            strokeHistory = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updatePenSettings() {
            penWidth = parseInt(document.getElementById('penWidth').value, 10);
            document.getElementById('penWidthVal').innerText = penWidth + 'px';
        }

        function setPenColor(color) {
            penColor = color;
            document.querySelectorAll('.sig-color-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-600'));
            event.currentTarget.classList.add('ring-2', 'ring-offset-2', 'ring-blue-600');
        }

        // Attach Canvas Events for Mobile Touch & Mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        /* ==================== STYLIZED FONT SIGNATURE ENGINE ==================== */
        function updateFontSignatureCanvas() {
            if (currentAppMode !== 'fontSignature') return;
            const width = canvas.width;
            const height = canvas.height;
            const name = document.getElementById('sigNameInput').value.trim() || '홍길동';
            const font = document.querySelector('input[name="sigFontFamily"]:checked').value;

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = sigFontColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let fontSize = 90;
            if (name.length >= 5) fontSize = 60;
            if (name.length >= 8) fontSize = 45;

            ctx.font = `bold ${fontSize}px ${font}`;
            ctx.fillText(name, width / 2, height / 2);
        }

        function setSigFontColor(color) {
            sigFontColor = color;
            document.querySelectorAll('.sigfont-color-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-600'));
            event.currentTarget.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-600');
            updateFontSignatureCanvas();
        }

        // Font Radio Change Listener for Stylized Signature
        document.querySelectorAll('input[name="sigFontFamily"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('.sig-font-option').forEach(opt => {
                    opt.classList.remove('border-indigo-500', 'bg-indigo-50/50');
                    opt.classList.add('border-slate-200');
                    opt.querySelector('.sig-check-icon').classList.add('opacity-0');
                });
                const parent = e.target.closest('.sig-font-option');
                parent.classList.remove('border-slate-200');
                parent.classList.add('border-indigo-500', 'bg-indigo-50/50');
                parent.querySelector('.sig-check-icon').classList.remove('opacity-0');
            });
        });

        /* ==================== STAMP ENGINE ==================== */
        document.querySelectorAll('input[name="fontFamily"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('.font-option').forEach(opt => {
                    opt.classList.remove('border-red-500', 'bg-red-50/50');
                    opt.classList.add('border-slate-200');
                    opt.querySelector('.check-icon').classList.add('opacity-0');
                });
                const parent = e.target.closest('.font-option');
                parent.classList.remove('border-slate-200');
                parent.classList.add('border-red-500', 'bg-red-50/50');
                parent.querySelector('.check-icon').classList.remove('opacity-0');
            });
        });

        function setLayout(layout) {
            currentLayout = layout;
            document.querySelectorAll('.layout-btn').forEach(btn => {
                btn.classList.remove('border-red-500', 'bg-red-50', 'text-red-600', 'font-bold');
                btn.classList.add('border-slate-200', 'text-slate-600', 'font-medium');
            });
            const activeBtn = document.getElementById(`layout-${layout}`);
            if(activeBtn) {
                activeBtn.classList.remove('border-slate-200', 'text-slate-600', 'font-medium');
                activeBtn.classList.add('border-red-500', 'bg-red-50', 'text-red-600', 'font-bold');
            }
            updateCanvas();
        }

        function setShape(shape) {
            currentShape = shape;
            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.classList.remove('border-red-500', 'bg-red-50', 'text-red-600');
                btn.classList.add('border-slate-200', 'text-slate-700');
                const icon = btn.querySelector('div');
                if (icon) {
                    icon.classList.remove('border-red-600');
                    icon.classList.add('border-slate-600');
                }
            });
            const activeBtn = document.getElementById(`shape-${shape}`);
            if(activeBtn) {
                activeBtn.classList.remove('border-slate-200', 'text-slate-700');
                activeBtn.classList.add('border-red-500', 'bg-red-50', 'text-red-600');
                const icon = activeBtn.querySelector('div');
                if (icon) {
                    icon.classList.remove('border-slate-600');
                    icon.classList.add('border-red-600');
                }
            }
            updateCanvas();
        }

        function setColor(hex) {
            currentColor = hex;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2', 'ring-red-600');
            });
            event.currentTarget.classList.add('ring-2', 'ring-offset-2', 'ring-red-600');
            updateCanvas();
        }

        function applyPreset(preset) {
            const suffixOption = document.getElementById('suffixOption');
            const borderWidth = document.getElementById('borderWidth');
            const borderType = document.getElementById('borderType');
            const grungeSlider = document.getElementById('grungeSlider');

            if(preset === 'personal_round') {
                setShape('circle');
                setLayout('vertical');
                setFont("'Nanum Myeongjo', serif");
                borderType.value = 'single';
                borderWidth.value = 8;
                suffixOption.value = '인';
                grungeSlider.value = 15;
            } else if(preset === 'approval_square') {
                setShape('square');
                setLayout('grid2x2');
                setFont("'Song Myung', serif");
                borderType.value = 'double';
                borderWidth.value = 10;
                suffixOption.value = '印';
                grungeSlider.value = 10;
            } else if(preset === 'oval_signature') {
                setShape('oval');
                setLayout('vertical');
                setFont("'Gowun Batang', serif");
                borderType.value = 'single';
                borderWidth.value = 6;
                suffixOption.value = '인';
                grungeSlider.value = 20;
            } else if(preset === 'calli_stamp') {
                setShape('circle');
                setLayout('horizontal');
                setFont("'Nanum Pen Script', cursive");
                borderType.value = 'single';
                borderWidth.value = 7;
                suffixOption.value = 'none';
                grungeSlider.value = 35;
            }
            updateCanvas();
        }

        function setFont(fontFamilyStr) {
            const radio = document.querySelector(`input[name="fontFamily"][value="${fontFamilyStr}"]`);
            if(radio) {
                radio.checked = true;
                radio.dispatchEvent(new Event('change'));
            }
        }

        function updateCanvas() {
            if (currentAppMode !== 'stamp') return;

            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            let rawName = document.getElementById('nameInput').value.trim() || '홍길동';
            const suffix = document.getElementById('suffixOption').value;
            const selectedFont = document.querySelector('input[name="fontFamily"]:checked').value;
            const borderStyle = document.getElementById('borderType').value;
            const bWidth = parseInt(document.getElementById('borderWidth').value, 10);
            const grungeLevel = parseInt(document.getElementById('grungeSlider').value, 10);

            document.getElementById('borderWidthVal').innerText = bWidth + 'px';
            document.getElementById('grungeVal').innerText = grungeLevel === 0 ? '없음' : (grungeLevel < 30 ? '은은함' : (grungeLevel < 70 ? '보통' : '진함'));

            let fullText = rawName;
            if (suffix !== 'none') {
                fullText += suffix;
            }

            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = currentColor;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = bWidth;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            const margin = 20;
            const size = width - (margin * 2);

            // Outer Frame
            if (borderStyle !== 'none') {
                ctx.beginPath();
                if (currentShape === 'circle') {
                    ctx.arc(centerX, centerY, size / 2, 0, Math.PI * 2);
                } else if (currentShape === 'oval') {
                    ctx.ellipse(centerX, centerY, size / 2.6, size / 1.7, 0, 0, Math.PI * 2);
                } else if (currentShape === 'square') {
                    ctx.rect(margin, margin, size, size);
                } else if (currentShape === 'rounded_square') {
                    ctx.roundRect(margin, margin, size, size, 30);
                }
                ctx.stroke();

                if (borderStyle === 'double') {
                    ctx.save();
                    ctx.lineWidth = Math.max(2, bWidth / 3);
                    const gap = bWidth + 4;
                    ctx.beginPath();
                    if (currentShape === 'circle') {
                        ctx.arc(centerX, centerY, (size / 2) - gap, 0, Math.PI * 2);
                    } else if (currentShape === 'oval') {
                        ctx.ellipse(centerX, centerY, (size / 2.6) - gap, (size / 1.7) - gap, 0, 0, Math.PI * 2);
                    } else if (currentShape === 'square') {
                        ctx.rect(margin + gap, margin + gap, size - (gap * 2), size - (gap * 2));
                    } else if (currentShape === 'rounded_square') {
                        ctx.roundRect(margin + gap, margin + gap, size - (gap * 2), size - (gap * 2), 20);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Text Positioning
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const chars = fullText.split('');
            const len = chars.length;

            let baseFontSize = 95;
            if (currentShape === 'oval') baseFontSize = 80;
            if (len === 1) baseFontSize = 130;
            if (len === 2) baseFontSize = 110;
            if (len === 3) baseFontSize = 90;
            if (len >= 4) baseFontSize = 75;

            ctx.font = `bold ${baseFontSize}px ${selectedFont}`;

            if (currentLayout === 'vertical') {
                if (len === 1) {
                    ctx.fillText(chars[0], centerX, centerY);
                } else if (len === 2) {
                    ctx.fillText(chars[0], centerX, centerY - baseFontSize * 0.5);
                    ctx.fillText(chars[1], centerX, centerY + baseFontSize * 0.5);
                } else if (len === 3) {
                    const offsetX = size * 0.18;
                    ctx.fillText(chars[0], centerX + offsetX, centerY - baseFontSize * 0.45);
                    ctx.fillText(chars[1], centerX - offsetX, centerY - baseFontSize * 0.45);
                    ctx.fillText(chars[2], centerX - offsetX, centerY + baseFontSize * 0.45);
                } else {
                    const stepY = (size * 0.65) / len;
                    const startY = centerY - ((len - 1) * stepY) / 2;
                    chars.forEach((c, idx) => {
                        ctx.fillText(c, centerX, startY + (idx * stepY));
                    });
                }
            } else if (currentLayout === 'grid2x2') {
                const offX = size * 0.20;
                const offY = size * 0.22;
                if (len >= 4) {
                    ctx.fillText(chars[0], centerX + offX, centerY - offY);
                    ctx.fillText(chars[1], centerX + offX, centerY + offY);
                    ctx.fillText(chars[2], centerX - offX, centerY - offY);
                    ctx.fillText(chars[3], centerX - offX, centerY + offY);
                } else if (len === 3) {
                    ctx.fillText(chars[0], centerX + offX, centerY - offY);
                    ctx.fillText(chars[1], centerX + offX, centerY + offY);
                    ctx.fillText(chars[2], centerX - offX, centerY);
                } else {
                    ctx.fillText(chars[0], centerX, centerY);
                }
            } else if (currentLayout === 'horizontal') {
                ctx.fillText(fullText, centerX, centerY);
            }

            // Vintage Texture
            if (grungeLevel > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'destination-out';
                let seed = 98765;
                const pseudoRandom = () => {
                    const x = Math.sin(seed++) * 10000;
                    return x - Math.floor(x);
                };
                const dotCount = Math.floor((width * height) * (grungeLevel / 30000));
                for (let i = 0; i < dotCount; i++) {
                    const rx = pseudoRandom() * width;
                    const ry = pseudoRandom() * height;
                    const rRadius = pseudoRandom() * 2 + 0.5;
                    ctx.beginPath();
                    ctx.arc(rx, ry, rRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        /* ==================== EXPORT & TOAST UTILS ==================== */
        function downloadPNG() {
            let filename = '도장';
            if (currentAppMode === 'stamp') {
                const name = document.getElementById('nameInput').value.trim() || '도장';
                filename = `${name}_전자도장.png`;
            } else if (currentAppMode === 'drawSignature') {
                filename = `전자서명.png`;
            } else {
                const name = document.getElementById('sigNameInput').value.trim() || '서명';
                filename = `${name}_전자서명.png`;
            }

            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('투명 PNG 이미지가 저장되었습니다!');
        }

        function copyToClipboard() {
            canvas.toBlob((blob) => {
                if (!blob) {
                    showToast('이미지 생성에 실패했습니다.', true);
                    return;
                }
                try {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]).then(() => {
                        showToast('클립보드에 이미지가 복사되었습니다!');
                    }).catch(() => {
                        showToast('모바일 브라우저는 복사를 지원하지 않을 수 있습니다. 저장하기를 이용하세요.', true);
                    });
                } catch (e) {
                    showToast('저장하기 버튼을 이용해 주세요.', true);
                }
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            toastIcon.className = isError 
                ? 'fa-solid fa-circle-exclamation text-amber-400' 
                : 'fa-solid fa-circle-check text-green-400';

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }

        window.onload = () => {
            updateCanvas();
        };
    </script>
</body>
</html>

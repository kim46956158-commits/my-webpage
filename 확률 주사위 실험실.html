<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>확률 주사위 실험실</title>
<style>
:root{--bg:#0b3d2a;--card:#0f4d35;--tx:#eef5ef;--mu:#a8c9b5;--bd:#1f6a4a;--ac:#ffb703;--ac2:#7ddf9c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 2px}.sub{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;min-width:0}
.card h2{font-size:1rem;margin:0 0 10px}
#stage{width:100%;height:280px;border-radius:10px;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.res{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}
.big{font-size:2rem;font-weight:700;color:var(--ac)}
.hist{color:var(--mu);font-size:.85rem;word-break:break-all}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,input{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:9px 14px;background:var(--card);color:var(--tx)}
button{cursor:pointer;font-weight:600}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input{width:110px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:center}th{color:var(--mu);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
#chart{width:100%;height:260px;display:block}
.full{grid-column:1/-1}
.pg{margin-top:12px}.pgl{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mu);margin-bottom:5px}#pp{color:var(--ac);font-weight:700}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:99px;transition:width .15s}
</style></head>
<body><div class="wrap">
<h1>🎲 확률 주사위 실험실</h1>
<p class="sub">주사위를 대량으로 굴려 각 눈의 상대도수가 이론 확률 1/6(≈16.67%)에 수렴하는지 관찰해 보세요.</p>
<div class="grid">
<div class="card"><h2>3D 주사위</h2><div id="stage"></div>
<div class="res"><div>최근 결과 <span class="big" id="last">-</span></div><div class="hist" id="hist"></div></div>
<div class="pg"><div class="pgl"><span id="pt">대기 중</span><span id="pp">0%</span></div><div class="bar"><i id="pb"></i></div></div>
<div class="btns">
<button class="p" id="b1">1회</button><button id="b10">10회</button><button id="b100">100회</button>
<input id="cn" type="number" min="1" max="100000" value="1000" aria-label="사용자 지정 횟수"><button id="bc">지정 횟수 굴리기</button>
<button id="rs">초기화</button></div></div>
<div class="card"><h2>집계표</h2><div class="tw"><table>
<thead><tr><th>눈</th><th>출현 횟수</th><th>백분율</th><th>이론값과의 차</th></tr></thead>
<tbody id="tb"></tbody><tfoot><tr><td>합계</td><td id="tt">0</td><td id="tp">0.00%</td><td></td></tr></tfoot></table></div></div>
<div class="card full"><h2>눈별 출현 비율 (점선: 이론 확률 16.67%)</h2><canvas id="chart"></canvas></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let counts=[0,0,0,0,0,0],total=0,hist=[],busy=false,token=0;
// ---- 표 / 차트 ----
function render(){
  $('tb').innerHTML=counts.map((c,i)=>{const p=total?c/total*100:0,d=total?p-100/6:0;
    return `<tr><td>${i+1}</td><td>${c.toLocaleString()}</td><td>${p.toFixed(2)}%</td><td>${total?(d>=0?'+':'')+d.toFixed(2)+'%p':'-'}</td></tr>`}).join('');
  $('tt').textContent=total.toLocaleString();$('tp').textContent=total?'100.00%':'0.00%';
  $('hist').textContent=hist.length?'기록: '+hist.slice(-12).join(' · '):'';
  drawChart();
}
function drawChart(){
  const cv=$('chart'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),tx=cs.getPropertyValue('--tx'),mu=cs.getPropertyValue('--mu'),bd=cs.getPropertyValue('--bd'),ac=cs.getPropertyValue('--ac2');
  const ps=counts.map(c=>total?c/total*100:0);
  const mx=Math.max(30,Math.ceil((Math.max(...ps)+4)/10)*10),L=40,B=26,T=14,pw=W-L-10,ph=H-B-T;
  const y=v=>T+ph-v/mx*ph;g.font='12px sans-serif';g.textAlign='right';g.fillStyle=mu;g.strokeStyle=bd;
  for(let v=0;v<=mx;v+=10){g.beginPath();g.moveTo(L,y(v));g.lineTo(W-10,y(v));g.stroke();g.fillText(v+'%',L-6,y(v)+4)}
  const bw=pw/6;g.textAlign='center';
  ps.forEach((p,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;g.fillStyle=ac;g.fillRect(x,y(p),w,T+ph-y(p));
    g.fillStyle=tx;g.fillText(p.toFixed(1)+'%',x+w/2,y(p)-5);g.fillStyle=mu;g.fillText(i+1,x+w/2,H-8)});
  g.setLineDash([6,4]);g.strokeStyle='#e8590c';g.beginPath();g.moveTo(L,y(100/6));g.lineTo(W-10,y(100/6));g.stroke();g.setLineDash([]);
}
addEventListener('resize',()=>{resize();drawChart()});
function record(v){counts[v-1]++;total++;hist.push(v);if(hist.length>200)hist.shift();$('last').textContent=v}
// ---- Three.js ----
const stage=$('stage'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,50);cam.position.set(0,5.2,6.2);cam.lookAt(0,1.2,0);
scene.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,8,5);scene.add(dl);
function face(n){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#fbfaf5';g.fillRect(0,0,128,128);g.strokeStyle='#d6d3c8';g.lineWidth=6;g.strokeRect(3,3,122,122);
  const P={1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.28,.28],[.5,.5],[.72,.72]],4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
  5:[[.28,.28],[.72,.28],[.5,.5],[.28,.72],[.72,.72]],6:[[.28,.25],[.72,.25],[.28,.5],[.72,.5],[.28,.75],[.72,.75]]};
  P[n].forEach(([x,y])=>{g.beginPath();g.arc(x*128,y*128,n==1?15:11,0,7);g.fillStyle=n==1?'#d6336c':'#1d1d1b';g.fill()});
  return new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c),roughness:.35})}
const FV=[3,4,1,6,2,5],NRM={3:[1,0,0],4:[-1,0,0],1:[0,1,0],6:[0,-1,0],2:[0,0,1],5:[0,0,-1]};
const dice=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8),FV.map(face));dice.position.y=.9;scene.add(dice);
const sh=new THREE.Mesh(new THREE.CircleGeometry(1.3,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25}));
sh.rotation.x=-Math.PI/2;sh.position.y=.01;scene.add(sh);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
let anim=null;
function rollOnce(v,dur,cb){
  const up=new THREE.Vector3(0,1,0),n=new THREE.Vector3(...NRM[v]);
  const tq=new THREE.Quaternion().setFromUnitVectors(n,up);
  tq.premultiply(new THREE.Quaternion().setFromAxisAngle(up,Math.random()*Math.PI*2));
  anim={t0:performance.now(),dur,sq:dice.quaternion.clone(),tq,
    axis:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),spins:2+Math.random()*2,cb};
}
function loop(now){requestAnimationFrame(loop);
  if(anim){const t=Math.min((now-anim.t0)/anim.dur,1),e=1-Math.pow(1-t,3);
    const base=anim.sq.clone().slerp(anim.tq,e);
    const ex=new THREE.Quaternion().setFromAxisAngle(anim.axis,(1-e)*anim.spins*Math.PI*2);
    dice.quaternion.copy(ex.multiply(base));
    const y=.9+2*Math.abs(Math.sin(t*Math.PI*2.5))*Math.pow(1-t,1.3);dice.position.y=y;
    const s=1-Math.min((y-.9)/3,.6);sh.scale.setScalar(s);sh.material.opacity=.25*s;
    if(t>=1){const cb=anim.cb;anim=null;cb&&cb()}}
  renderer.render(scene,cam)}
function prog(d,n){const p=n?d/n*100:0;$('pb').style.width=p+'%';$('pp').textContent=p.toFixed(0)+'%';
  $('pt').textContent=n?`진행 ${d.toLocaleString()} / ${n.toLocaleString()}회`+(d>=n?' · 완료':''):'대기 중'}
// ---- 시뮬레이션 ----
const rnd=()=>1+Math.floor(Math.random()*6),ids=['b1','b10','b100','bc'];
function setBusy(b){busy=b;ids.forEach(i=>$(i).disabled=b)}
function run(n){
  if(busy||!(n>=1))return;n=Math.min(Math.floor(n),100000);setBusy(true);const my=++token;prog(0,n);
  if(n<=10){let i=0;(function next(){if(my!==token)return;if(i>=n){setBusy(false);return}
    const v=rnd();rollOnce(v,n==1?1100:700,()=>{record(v);render();i++;prog(i,n);next()})})();return}
  const k=Math.ceil(n/60);let done=0;
  const iv=setInterval(()=>{if(my!==token){clearInterval(iv);return}
    const m=Math.min(k,n-done);let v=1;for(let j=0;j<m;j++){v=rnd();record(v)}done+=m;render();prog(done,n);
    if(done>=n){clearInterval(iv);rollOnce(v,700,()=>setBusy(false))}else rollOnce(v,320)},60);
}
$('b1').onclick=()=>run(1);$('b10').onclick=()=>run(10);$('b100').onclick=()=>run(100);
$('bc').onclick=()=>{const v=parseInt($('cn').value);if(v>=1)run(v);else $('cn').focus()};
$('rs').onclick=()=>{token++;anim=null;counts=[0,0,0,0,0,0];total=0;hist=[];prog(0,0);$('last').textContent='-';
  dice.position.y=.9;sh.scale.setScalar(1);setBusy(false);render()};
resize();render();requestAnimationFrame(loop);
</script></body></html>

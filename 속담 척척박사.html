<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속담 척척박사</title>
<style>
:root{--bg:#fff6d6;--card:#fff;--ink:#2b2b3a;--mut:#6b6b80;--pri:#ff7a45;--pri-d:#c9501f;--grn:#2fb36d;--grn-d:#1e8650;--red:#e5484d;--blu:#4c7cf3;--blu-d:#2f55b8;--ln:#eadfae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--card:#2a2840;--ink:#f4f1ff;--mut:#b3aed0;--ln:#43406a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:640px}
.card{background:var(--card);border-radius:24px;padding:24px;border:3px solid var(--ln);box-shadow:0 8px 0 var(--ln);margin-top:8px}
h1{font-size:clamp(34px,9vw,52px);margin:0;text-align:center;color:var(--pri);text-shadow:0 4px 0 var(--pri-d);letter-spacing:-1px}
.sub{text-align:center;color:var(--mut);margin:12px 0 20px;line-height:1.6;font-size:17px}
.btn{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:16px;padding:14px 22px;color:#fff;cursor:pointer;background:var(--pri);box-shadow:0 6px 0 var(--pri-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pri-d)}
.btn.g{background:var(--grn);box-shadow:0 6px 0 var(--grn-d)}.btn.g:active{box-shadow:0 1px 0 var(--grn-d)}
.btn.b{background:var(--blu);box-shadow:0 6px 0 var(--blu-d)}.btn.b:active{box-shadow:0 1px 0 var(--blu-d)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 6px 0 #0003}
.big{width:100%;font-size:26px;padding:18px;margin-top:20px}
.set{background:linear-gradient(145deg,#ffe6a8,#ffc977);border-radius:20px;padding:18px;box-shadow:inset 0 -6px 0 #0001,0 6px 0 #d9a24d;color:#4a3410}
.set label{display:flex;justify-content:space-between;font-size:20px;font-weight:700}
.set b{font-size:30px}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--pri);height:28px}
.tick{display:flex;justify-content:space-between;font-size:14px;opacity:.8}
.teach{margin-top:18px;font-size:15px;color:var(--mut);text-align:center}
.teach input{display:none}.teach span{text-decoration:underline;cursor:pointer;color:var(--blu)}
.hud{display:flex;gap:10px}.hud div{flex:1;background:var(--card);border:3px solid var(--ln);border-radius:16px;padding:8px;text-align:center;font-size:15px;color:var(--mut);box-shadow:0 4px 0 var(--ln)}
.hud b{display:block;font-size:28px;color:var(--ink)}.hud .low b{color:var(--red)}
.bar{height:12px;background:var(--ln);border-radius:8px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn);width:100%;transition:width 1s linear}
.q{font-size:clamp(34px,9vw,54px);text-align:center;margin:26px 0 8px;word-break:keep-all;line-height:1.3}
.q em{font-style:normal;color:var(--pri)}
.hint{min-height:44px;text-align:center;font-size:28px;letter-spacing:4px;color:var(--blu);font-weight:700}
.row{display:flex;gap:10px;margin-top:10px}
#ans{flex:1;min-width:0;font:inherit;font-size:24px;padding:14px;border-radius:14px;border:3px solid var(--ln);background:var(--bg);color:var(--ink)}
#ans:focus{outline:3px solid var(--blu)}
.fb{min-height:80px;margin-top:16px;text-align:center;font-size:20px;line-height:1.6}
.ok{color:var(--grn);font-size:30px;font-weight:700}.no{color:var(--red);font-size:26px;font-weight:700}
.exp{background:var(--bg);border-radius:14px;padding:12px;margin-top:6px;font-size:19px;color:var(--ink)}
.stats{display:flex;gap:10px;margin:18px 0}.stats div{flex:1;text-align:center;background:var(--bg);border-radius:16px;padding:14px;color:var(--mut)}.stats b{display:block;font-size:36px;color:var(--pri)}
.wl{list-style:none;padding:0;margin:0}.wl li{background:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:18px}.wl s{color:var(--red)}
.hide{display:none!important}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#ov .box{background:var(--card);border-radius:24px;border:3px solid var(--red);box-shadow:0 8px 0 #0004;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="fx"></canvas>
<div id="ov" class="hide"><div class="box"><div id="ovb"></div><button class="btn big" id="nx2">다음 문제 ▶</button></div></div>
<main>
<section id="s1" class="card">
  <h1>🎈 속담 척척박사</h1>
  <p class="sub">속담의 앞부분을 보고 뒷부분을 맞혀 보세요!<br>정답은 +10점, 오답은 -5점! 제한 시간 안에 많이 맞힐수록 속담 박사에 가까워져요.</p>
  <div class="set">
    <label><span>⏱ 제한 시간</span><b><span id="tv">60</span>초</b></label>
    <input id="tm" type="range" min="0" max="60" step="5" value="60">
    <div class="tick"><span>0초</span><span>60초</span></div>
  </div>
  <button class="btn big" id="go">게임 시작! 🚀</button>
  <p class="teach"><span id="cnt"></span><br><label><input id="csv" type="file" accept=".csv,text/csv"><span>👩‍🏫 선생님: 속담 CSV 바꾸기 (앞부분,뒷부분,뜻풀이)</span></label></p>
</section>

<section id="s2" class="hide">
  <div class="hud"><div>점수<b id="sc">0</b></div><div>푼 문제 중 정답<b id="ok">0/0</b></div><div id="tbox">남은 시간<b id="tl">0</b></div></div>
  <div class="bar"><i id="tb"></i></div>
  <div class="card">
    <div class="q" id="q"></div>
    <div class="hint" id="hint"></div>
    <div class="row"><input id="ans" autocomplete="off" placeholder="뒷부분을 입력하세요"><button class="btn g" id="sub">확인</button></div>
    <div class="row"><button class="btn b" id="hb">💡 초성 힌트 (2)</button><button class="btn" id="nx" style="display:none">다음 ▶</button></div>
    <div class="fb" id="fb"></div>
  </div>
</section>

<section id="s3" class="card hide">
  <h1 id="rt">🏆 결과</h1>
  <div class="stats"><div>결과<b id="r1" style="font-size:26px">0</b></div><div>점수<b id="r2">0</b></div><div>남은 시간<b id="r3">0초</b></div></div>
  <div id="wrong"></div>
  <button class="btn big" id="again">다시 하기 🔁</button>
</section>
</main>
<script>
let DATA=[["가는 말이","고와야 오는 말이 곱다"],["가랑비에","옷 젖는 줄 모른다"],["가재는","게 편이다"],["갈수록","태산"],["같은 값이면","다홍치마"],["개구리 올챙이 적","생각 못 한다"],["고래 싸움에","새우 등 터진다"],["공든","탑이 무너지랴"],["구슬이 서 말이라도","꿰어야 보배"],["꿩 대신","닭"],["낮말은","새가 듣고 밤말은 쥐가 듣는다"],["누워서","떡 먹기"],["달면","삼키고 쓰면 뱉는다"],["닭 쫓던 개","지붕 쳐다보듯"],["도둑이","제 발 저리다"],["돌다리도","두들겨 보고 건너라"],["되로 주고","말로 받는다"],["등잔 밑이","어둡다"],["뛰는 놈 위에","나는 놈 있다"],["말 한마디에","천 냥 빚도 갚는다"],["믿는 도끼에","발등 찍힌다"],["바늘 도둑이","소 도둑 된다"],["백지장도","맞들면 낫다"],["보기 좋은 떡이","먹기도 좋다"],["빈 수레가","요란하다"],["사공이 많으면","배가 산으로 간다"],["서당 개 삼 년이면","풍월을 읊는다"],["세 살 버릇","여든까지 간다"],["소 잃고","외양간 고친다"],["쇠뿔도","단김에 빼라"],["시작이","반이다"],["아니 땐 굴뚝에","연기 나랴"],["우물 안","개구리"],["원숭이도","나무에서 떨어진다"],["윗물이","맑아야 아랫물이 맑다"],["자라 보고 놀란 가슴","솥뚜껑 보고 놀란다"],["작은 고추가","맵다"],["종로에서 뺨 맞고","한강에서 눈 흘긴다"],["천 리 길도","한 걸음부터"],["티끌 모아","태산"],["팔은","안으로 굽는다"],["평양 감사도","저 싫으면 그만이다"],["하늘의","별 따기"],["호랑이도 제 말 하면","온다"],["호미로 막을 것을","가래로 막는다"],["하나를 보면","열을 안다"],["열 번 찍어","안 넘어가는 나무 없다"],["백문이","불여일견"],["믿는 구석이 있어야","큰소리친다"],["금강산도","식후경"]];
const MEAN={"가는 말이":"내가 남에게 좋게 말해야 남도 나에게 좋게 말한다는 뜻이에요.","가랑비에":"작은 것도 계속 쌓이면 어느새 큰 것이 되니 조심하라는 뜻이에요.","가재는":"모양이나 처지가 비슷한 사람끼리 서로 편이 된다는 뜻이에요.","갈수록":"일이 점점 더 어렵고 힘들어진다는 뜻이에요.","같은 값이면":"같은 조건이라면 더 좋은 것을 고른다는 뜻이에요.","개구리 올챙이 적":"형편이 좋아진 뒤 어려웠던 때를 잊고 잘난 척한다는 뜻이에요.","고래 싸움에":"힘센 사람들끼리 싸우는 바람에 약한 사람이 피해를 본다는 뜻이에요.","공든":"정성을 다해 한 일은 결과가 헛되지 않는다는 뜻이에요.","구슬이 서 말이라도":"좋은 재료가 많아도 잘 다듬고 완성해야 쓸모가 있다는 뜻이에요.","꿩 대신":"꼭 맞는 것이 없을 때 비슷한 것으로 대신한다는 뜻이에요.","낮말은":"아무도 없는 줄 알아도 말은 퍼지기 쉬우니 항상 말조심하라는 뜻이에요.","누워서":"아주 쉬운 일을 말해요.","달면":"자기에게 이로우면 가까이하고, 해로우면 멀리한다는 뜻이에요.","닭 쫓던 개":"애써 하던 일이 실패해서 어찌할 수 없게 되었다는 뜻이에요.","도둑이":"잘못한 사람은 가만히 있어도 스스로 마음이 불안하다는 뜻이에요.","돌다리도":"잘 아는 일도 조심해서 확인하고 하라는 뜻이에요.","되로 주고":"조금 주고 훨씬 많이 돌려받는다는 뜻이에요.","등잔 밑이":"가까이 있는 것을 오히려 잘 모른다는 뜻이에요.","뛰는 놈 위에":"잘하는 사람 위에는 더 잘하는 사람이 있으니 뽐내지 말라는 뜻이에요.","말 한마디에":"말을 잘하면 어려운 일도 해결할 수 있다는 뜻이에요.","믿는 도끼에":"굳게 믿었던 사람에게 배신당한다는 뜻이에요.","바늘 도둑이":"작은 나쁜 짓도 버릇이 되면 큰 잘못으로 이어진다는 뜻이에요.","백지장도":"쉬운 일도 힘을 합치면 더 쉬워진다는 뜻이에요.","보기 좋은 떡이":"겉모양이 좋으면 내용도 좋다는 뜻이에요.","빈 수레가":"아는 것이 적은 사람이 더 시끄럽게 떠든다는 뜻이에요.","사공이 많으면":"일하는 사람이 너무 많아 의견이 달라 일이 잘못된다는 뜻이에요.","서당 개 삼 년이면":"그 분야에 오래 있으면 자연스럽게 알게 된다는 뜻이에요.","세 살 버릇":"어릴 때 몸에 밴 버릇은 평생 간다는 뜻이에요.","소 잃고":"일이 잘못된 뒤에 뒤늦게 대비해도 소용없다는 뜻이에요.","쇠뿔도":"좋은 일은 망설이지 말고 바로 해야 한다는 뜻이에요.","시작이":"무슨 일이든 시작하면 절반은 한 것과 같다는 뜻이에요.","아니 땐 굴뚝에":"원인이 없으면 결과도 없다는 뜻이에요. 소문에도 까닭이 있다는 말이에요.","우물 안":"넓은 세상을 모르고 자기 생각만 옳다고 믿는 사람을 말해요.","원숭이도":"아무리 잘하는 사람도 실수할 때가 있다는 뜻이에요.","윗물이":"윗사람이 바르게 행동해야 아랫사람도 따라 한다는 뜻이에요.","자라 보고 놀란 가슴":"한번 크게 놀라면 비슷한 것만 봐도 겁낸다는 뜻이에요.","작은 고추가":"몸집이 작아도 속은 야무지고 실속이 있다는 뜻이에요.","종로에서 뺨 맞고":"엉뚱한 곳에서 화풀이를 한다는 뜻이에요.","천 리 길도":"아무리 큰 일도 작은 첫걸음부터 시작한다는 뜻이에요.","티끌 모아":"작은 것도 모으면 큰 것이 된다는 뜻이에요.","팔은":"자기와 가까운 사람에게 마음이 더 기운다는 뜻이에요.","평양 감사도":"아무리 좋은 일도 본인이 싫으면 소용없다는 뜻이에요.","하늘의":"매우 어려운 일을 말해요.","호랑이도 제 말 하면":"다른 사람 이야기를 하는데 마침 그 사람이 나타난다는 뜻이에요.","호미로 막을 것을":"작을 때 처리하지 않으면 나중에 큰 힘이 든다는 뜻이에요.","하나를 보면":"한 가지를 보고 나머지를 짐작할 만큼 똑똑하다는 뜻이에요.","열 번 찍어":"끈기 있게 계속하면 결국 이룬다는 뜻이에요.","백문이":"백 번 듣는 것보다 한 번 직접 보는 것이 낫다는 뜻이에요.","믿는 구석이 있어야":"든든히 믿을 곳이 있어야 당당하게 행동할 수 있다는 뜻이에요.","금강산도":"아무리 좋은 일도 배가 불러야 즐길 수 있다는 뜻이에요."};
const mean=c=>c[2]||MEAN[c[0]]||"";
const $=id=>document.getElementById(id);
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho=s=>[...s].map(c=>{const n=c.charCodeAt(0)-44032;return n>=0&&n<11172?CHO[Math.floor(n/588)]:c}).join("");
const norm=s=>s.replace(/[\s.,!?'"’“”]/g,"");
let shownAt=0,paused=false,T=120,left=0,score=0,ok=0,hints=2,deck=[],cur=null,timer=null,locked=false,wrong=[];
function show(id){["s1","s2","s3"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function cnt(){$("cnt").textContent="📚 준비된 속담 "+DATA.length+"개"}
cnt();
$("tm").oninput=e=>{$("tv").textContent=e.target.value;$("go").disabled=+e.target.value<=0};
$("csv").onchange=e=>{const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const rows=t.replace(/^\uFEFF/,"").split(/\r?\n/).map(l=>l.split(",").map(x=>x.trim().replace(/^"|"$/g,""))).filter(r=>r.length>=2&&r[0]&&r[1]);
    if(rows[0]&&rows[0][0]==="앞부분")rows.shift();
    if(rows.length<3){alert("앞부분,뒷부분 형식의 속담이 3개 이상 필요해요.");return}
    DATA=rows.map(r=>[r[0],r[1],r.slice(2).join(",")]);cnt();alert(DATA.length+"개의 속담을 불러왔어요!")})};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$("go").onclick=()=>{if(+$("tm").value<=0)return;T=left=+$("tm").value;score=ok=0;wrong=[];deck=shuffle(DATA);upd();show("s2");next();
  clearInterval(timer);timer=setInterval(()=>{if(paused)return;left--;upd();if(left<=0)end()},1000)};
function upd(){$("sc").textContent=score;$("ok").textContent=ok+"/"+(ok+wrong.length);$("tl").textContent=left+"초";
  $("tb").style.width=Math.max(0,left/T*100)+"%";$("tbox").classList.toggle("low",left<=10)}
function next(){paused=false;$("ov").classList.add("hide");if(!deck.length)deck=shuffle(DATA);cur=deck.pop();locked=false;hints=2;
  $("q").innerHTML=cur[0]+" <em>…</em>";$("hint").textContent="";$("fb").innerHTML="";
  $("ans").value="";$("ans").disabled=false;$("sub").disabled=false;$("hb").disabled=false;$("hb").textContent="💡 초성 힌트 (2)";
  $("nx").style.display="none";$("hb").style.display="";$("ans").focus()}
$("hb").onclick=()=>{if(locked||hints<=0)return;const a=cur[1];hints--;
  if(hints===1)$("hint").textContent=cho(a);
  else{const w=a.split(" ");$("hint").textContent=w[0]+" "+w.slice(1).map(cho).join(" ")}
  $("hb").textContent="💡 초성 힌트 ("+hints+")";if(!hints)$("hb").disabled=true;$("ans").focus()};
const END=/(입니다|이에요|예요|이다|이야|이라|한다|해요|다|요|네|죠|야|라|랴)$/;
const key=t=>{let k=norm(t).replace(END,"").replace(/[은는이가을를도에의과와만]/g,"");return k||norm(t)};
function isOk(inp){const a=norm(inp),c=norm(cur[1]);if(!a)return false;
  if(a===c||a===norm(cur[0]+cur[1]))return true;
  const full=norm(cur[0]+cur[1]);
  return key(inp)===key(cur[1])||key(inp)===key(cur[0]+cur[1])||key(a.replace(norm(cur[0]),""))===key(cur[1])&&a.startsWith(norm(cur[0]))}
function check(){if(locked)return;const v=norm($("ans").value);if(!v)return;locked=true;
  $("ans").disabled=$("sub").disabled=true;
  if(isOk($("ans").value)){ok++;score+=10;upd();$("hint").textContent="";
    $("q").innerHTML=cur[0]+" <em>"+cur[1]+"</em>";$("fb").innerHTML='<div class="ok">🎉 정답이에요!</div>';boom();setTimeout(()=>{if(left>0)next()},1000)}
  else{wrong.push(cur);score-=5;upd();$("ovb").innerHTML='<div class="no" style="font-size:34px">❌ 틀렸어요!</div><div class="exp">내가 쓴 답: <s>'+esc($("ans").value)+'</s><br>정답: <b>'+esc(cur[1])+'</b><br>완성된 속담: '+esc(cur[0]+" "+cur[1])+(mean(cur)?'<br>💬 <b>뜻</b>: '+esc(mean(cur)):'')+'</div>';paused=true;$("ov").classList.remove("hide");shownAt=Date.now();setTimeout(()=>{if(paused)$("nx2").focus()},400)}}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("sub").onclick=check;$("ans").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(!e.isComposing&&!e.repeat&&!paused)check()}};
$("nx2").onclick=()=>{if(Date.now()-shownAt<400)return;next()};
function end(){paused=false;$("ov").classList.add("hide");clearInterval(timer);left=Math.max(0,left);$("r1").textContent=(ok+wrong.length)+"개 중 "+ok+"개";$("r2").textContent=score;$("r3").textContent=left+"초";
  $("rt").textContent=left>0?"🏆 결과":"⏰ 시간 끝!";
  $("wrong").innerHTML=wrong.length?'<h3>📝 다시 볼 속담</h3><ul class="wl">'+wrong.map(w=>"<li>"+esc(w[0])+" <b>"+esc(w[1])+"</b>"+(mean(w)?"<br><small>"+esc(mean(w))+"</small>":"")+"</li>").join("")+"</ul>":"<p class='sub'>틀린 문제가 없어요! 대단해요 👏</p>";
  show("s3");if(ok)boom()}
$("again").onclick=()=>show("s1");
// 폭죽
const cv=$("fx"),cx=cv.getContext("2d");let P=[],raf=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
function boom(){const C=["#ff7a45","#ffd23f","#2fb36d","#4c7cf3","#e5484d","#b36bff"];
  for(let k=0;k<3;k++){const x=cv.width*(.2+Math.random()*.6),y=cv.height*(.2+Math.random()*.3);
    for(let i=0;i<40;i++){const a=Math.random()*6.28,s=2+Math.random()*6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60,c:C[i%6]})}}
  if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.98;p.l--;cx.globalAlpha=p.l/60;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill()}
  raf=P.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
</script></body></html>
